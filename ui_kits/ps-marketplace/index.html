<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PartsSource — Marketplace UI kit</title>
  <link rel="stylesheet" href="../../tokens.css">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    body { margin: 0; background: #fff; color: #4A4A4A; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #009CF4; outline-offset: 2px; }
    * { box-sizing: border-box; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="ProductCard.jsx"></script>
  <script type="text/babel" src="ProductGrid.jsx"></script>
  <script type="text/babel" src="PDP.jsx"></script>
  <script type="text/babel" src="Cart.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel">
    const { useState } = React;

    const PRODUCTS = [
      { id: 1, name: 'Reusable Finger Sensor by Masimo', manufacturer: 'Masimo', price: 248, sku: 'DS100A', badge: 'OEM' },
      { id: 2, name: 'ECG Leadwire Set, 10-Lead Banana Plug', manufacturer: 'GE Healthcare', price: 412, sku: '2016560-001', badge: 'In Stock' },
      { id: 3, name: 'Warming Unit Replacement Hose, Bair Hugger 700', manufacturer: '3M Healthcare', price: 186, sku: '775' },
      { id: 4, name: 'Reusable Adult Oral Temperature Probe, 9ft', manufacturer: 'Welch Allyn', price: 92, sku: '02893-100' },
      { id: 5, name: 'Hose, Blood Pressure, FAST, 5 ft', manufacturer: 'Welch Allyn', price: 38, sku: 'REUSE-10-1SC' },
      { id: 6, name: 'SpO2 Sensor Connection Cable, 10 ft', manufacturer: 'Nellcor – Covidien', price: 124, sku: 'DEC-8' },
      { id: 7, name: 'Xenon Replacement Halogen Lamp, 14V', manufacturer: 'Olympus America', price: 218, sku: 'CLK-4' },
      { id: 8, name: 'Sealed Lead Acid Battery 6V 3.3Ah', manufacturer: 'GE Medical Systems', price: 64, sku: 'BAT-6V33' },
    ];

    function App() {
      const [view, setView] = useState('home'); // home | results | pdp
      const [selected, setSelected] = useState(null);
      const [cart, setCart] = useState([]);
      const [cartOpen, setCartOpen] = useState(false);
      const [query, setQuery] = useState('');

      const addToCart = (p, qty = 1) => {
        setCart(prev => {
          const ex = prev.find(i => i.id === p.id);
          if (ex) return prev.map(i => i.id === p.id ? { ...i, qty: i.qty + qty } : i);
          return [...prev, { ...p, qty }];
        });
        setCartOpen(true);
      };
      const removeFromCart = (it) => setCart(prev => prev.filter(i => i.id !== it.id));

      const openPDP = (p) => { setSelected(p); setView('pdp'); window.scrollTo(0,0); };
      const runSearch = (q) => { setQuery(q); setView('results'); window.scrollTo(0,0); };

      return (
        <div>
          <Header
            onSearch={runSearch}
            onNav={(target) => { if (target === 'home') setView('home'); if (target === 'cart') setCartOpen(true); }}
            cartCount={cart.reduce((s, i) => s + i.qty, 0)}
          />

          {view === 'home' && (
            <>
              <Hero onCta={() => setView('results')} />
              <ProductCarousel title="Products demo" subtitle="View All Products →" products={PRODUCTS.slice(0, 8)} onSelect={openPDP} />
              <section style={{ padding: '16px 32px 48px' }}>
                <h2 style={{ fontSize: 24, fontWeight: 300, color: '#002F48', margin: '0 0 20px' }}>Shop by category</h2>
                <ProductGrid products={PRODUCTS} onSelect={openPDP} />
              </section>
            </>
          )}

          {view === 'results' && (
            <>
              <Breadcrumb items={[{ label: 'Home' }, { label: query ? `Search: "${query}"` : 'All Parts' }]} onNav={() => setView('home')} />
              <section style={{ padding: '8px 32px 48px' }}>
                <h1 style={{ fontSize: 30, fontWeight: 300, color: '#002F48', margin: '0 0 4px' }}>
                  {query ? `Results for "${query}"` : 'All Parts'}
                </h1>
                <div style={{ color: '#777', fontSize: 14, marginBottom: 24 }}>{PRODUCTS.length} items · Showing 1–{PRODUCTS.length}</div>
                <ProductGrid products={PRODUCTS} onSelect={openPDP} />
              </section>
            </>
          )}

          {view === 'pdp' && selected && (
            <PDP product={selected} onBack={() => setView('results')} onAdd={addToCart} />
          )}

          <Footer />

          {cartOpen && (
            <>
              <div onClick={() => setCartOpen(false)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,47,72,.5)', zIndex: 99 }}></div>
              <Cart items={cart} onClose={() => setCartOpen(false)} onRemove={removeFromCart} onCheckout={() => alert('Checkout demo — not wired up.')} />
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
