    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {

      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {

           <td>Input padding, medium gaps<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td><code>--ps-space-4<\u002Fcode><\u002Ftd>\n            <td>16px<\u002Ftd>\n            <td><div class=\"spacing-bar\" style=\"width: 16px;\"><\u002Fdiv><\u002Ftd>\n            <td>Card padding, standard gaps<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td><code>--ps-space-6<\u002Fcode><\u002Ftd>\n            <td>24px<\u002Ftd>\n            <td><div class=\"spacing-bar\" style=\"width: 24px;\"><\u002Fdiv><\u002Ftd>\n            <td>Section spacing<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td><code>--ps-space-8<\u002Fcode><\u002Ftd>\n            <td>32px<\u002Ftd>\n            <td><div class=\"spacing-bar\" style=\"width: 32px;\"><\u002Fdiv><\u002Ftd>\n            <td>Large section gaps<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td><code>--ps-space-12<\u002Fcode><\u002Ftd>\n            <td>48px<\u002Ftd>\n            <td><div class=\"spacing-bar\" style=\"width: 48px;\"><\u002Fdiv><\u002Ftd>\n            <td>Page margins<\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fsection>\n\n    <section id=\"radius\" class=\"section\">\n      <h2 class=\"section-title\">Border Radius<\u002Fh2>\n      <p style=\"margin-bottom: 24px; color: var(--ps-fg-secondary);\">Standard radius tokens for consistent corner rounding across buttons, cards, inputs, and containers.<\u002Fp>\n      \n      <div class=\"radius-grid\">\n        <div class=\"radius-example\">\n          <div class=\"radius-box\" style=\"border-radius: 0;\"><\u002Fdiv>\n          <div>\n            <div class=\"radius-label\">none<\u002Fdiv>\n            <div class=\"radius-value\">0<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"radius-example\">\n          <div class=\"radius-box\" style=\"border-radius: 2px;\"><\u002Fdiv>\n          <div>\n            <div class=\"radius-label\">sm<\u002Fdiv>\n            <div class=\"radius-value\">2px<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"radius-example\">\n          <div class=\"radius-box\" style=\"border-radius: 4px;\"><\u002Fdiv>\n          <div>\n            <div class=\"radius-label\">md (default)<\u002Fdiv>\n            <div class=\"radius-value\">4px<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"radius-example\">\n          <div class=\"radius-box\" style=\"border-radius: 8px;\"><\u002Fdiv>\n          <div>\n            <div class=\"radius-label\">xl<\u002Fdiv>\n            <div class=\"radius-value\">8px<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"radius-example\">\n          <div class=\"radius-box\" style=\"border-radius: 100px;\"><\u002Fdiv>\n          <div>\n            <div class=\"radius-label\">pill<\u002Fdiv>\n            <div class=\"radius-value\">100px<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"shadows\" class=\"section\">\n      <h2 class=\"section-title\">Shadows<\u002Fh2>\n      <p style=\"margin-bottom: 24px; color: var(--ps-fg-secondary);\">Elevation system for cards, dropdowns, and modals. Use to establish visual hierarchy and depth.<\u002Fp>\n      \n      <div style=\"display: flex; gap: 32px; flex-wrap: wrap;\">\n        <div>\n          <div class=\"shadow-example\" style=\"box-shadow: 0 1px 2px rgba(0,0,0,0.05);\">sm<\u002Fdiv>\n          <div style=\"margin-top: 12px; font-size: 11px; font-family: var(--ps-font-mono); color: var(--ps-fg-secondary);\">\n            0 1px 2px rgba(0,0,0,0.05)\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"shadow-example\" style=\"box-shadow: 0 4px 6px rgba(0,0,0,0.07);\">md<\u002Fdiv>\n          <div style=\"margin-top: 12px; font-size: 11px; font-family: var(--ps-font-mono); color: var(--ps-fg-secondary);\">\n            0 4px 6px rgba(0,0,0,0.07)\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"shadow-example\" style=\"box-shadow: 0 10px 15px rgba(0,0,0,0.1);\">lg<\u002Fdiv>\n          <div style=\"margin-top: 12px; font-size: 11px; font-family: var(--ps-font-mono); color: var(--ps-fg-secondary);\">\n            0 10px 15px rgba(0,0,0,0.1)\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"logo\" class=\"section\">\n      <h2 class=\"section-title\">Logo<\u002Fh2>\n      <p style=\"margin-bottom: 24px; color: var(--ps-fg-secondary);\">The PartsSource wordmark in three official colorways: blue (primary), white (reversed), and black (single-color print only).<\u002Fp>\n      \n      <div class=\"subsection\">\n        <h3 class=\"subsection-title\">PS Blue Wordmark<\u002Fh3>\n        <p style=\"margin-bottom: 16px; color: var(--ps-fg-secondary); font-size: 14px;\">Use on white, subtle grey (#FAFAFA), and muted grey (#F1F1F1) backgrounds.<\u002Fp>\n        <div style=\"background: #FAFAFA; padding: 48px; border-radius: 8px; text-align: center; border: 1px solid var(--ps-border-default);\">\n          <div style=\"font-size: 32px; font-weight: 700; color: #005BA6;\">PartsSource<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      \n      <div class=\"subsection\">\n        <h3 class=\"subsection-title\">White Wordmark<\u002Fh3>\n        <p style=\"margin-bottom: 16px; color: var(--ps-fg-secondary); font-size: 14px;\">Use on PS Blue, Midnight, black, and dark imagery.<\u002Fp>\n        <div style=\"background: #005BA6; padding: 48px; border-radius: 8px; text-align: center;\">\n          <div style=\"font-size: 32px; font-weight: 700; color: #FFFFFF;\">PartsSource<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      \n      <div class=\"accessibility-note\">\n        <h4>Logo Usage Guidelines<\u002Fh4>\n        <ul>\n          <li><strong>Clearspace:<\u002Fstrong> Reserve space equal to cap-height of \"P\" on all sides<\u002Fli>\n          <li><strong>Minimum size:<\u002Fstrong> 160px width for full wordmark<\u002Fli>\n          <li><strong>Black wordmark:<\u002Fstrong> Use only for single-color print<\u002Fli>\n          <li><strong>Clickable logos:<\u002Fstrong> Wrap in &lt;a&gt; with aria-label=\"Go to homepage\"<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"icons\" class=\"section\">\n      <h2 class=\"section-title\">Icons<\u002Fh2>\n      <p style=\"margin-bottom: 24px; color: var(--ps-fg-secondary);\">Full Lucide icon set with 1.75px stroke weight. Default color is Midnight (#002F48) for light backgrounds, white for dark.<\u002Fp>\n      \n      <div class=\"accessibility-note\">\n        <h4>Icon Guidelines<\u002Fh4>\n        <ul>\n          <li><strong>Default stroke:<\u002Fstrong> 1.75px for all icons<\u002Fli>\n          <li><strong>Sizes:<\u002Fstrong> 16px, 20px, 24px (default), 32px<\u002Fli>\n          <li><strong>Accessibility:<\u002Fstrong> Use aria-label or aria-hidden=\"true\" + visible text<\u002Fli>\n          <li><strong>Interactive icons:<\u002Fstrong> Minimum 44×44px touch target<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"buttons\" class=\"section\">\n      <h2 class=\"section-title\">Buttons<\u002Fh2>\n      \n      <div class=\"subsection\">\n        <h3 class=\"subsection-title\">Primary Button (Large)<\u002Fh3>\n        <div style=\"display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 16px;\">\n          <button class=\"btn primary lg\">Request Quote<\u002Fbutton>\n          <button class=\"btn primary lg\" style=\"background: #005BA6; color: #fff;\">Request Quote<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"font-size: 13px; color: var(--ps-fg-secondary);\">325×50px • 2px border • 4px radius • Outline default, filled on hover<\u002Fp>\n      <\u002Fdiv>\n      \n      <div class=\"subsection\">\n        <h3 class=\"subsection-title\">Small Button<\u002Fh3>\n        <div style=\"display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 16px;\">\n          <button class=\"btn primary sm\">FILTER<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"font-size: 13px; color: var(--ps-fg-secondary);\">87×32px • 1px border • 4px radius • 10px text<\u002Fp>\n      <\u002Fdiv>\n      \n      <div class=\"subsection\">\n        <h3 class=\"subsection-title\">Orange Pill CTA<\u002Fh3>\n        <div style=\"display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;\">\n          <button class=\"btn pill\">See Buying Options<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"font-size: 13px; color: var(--ps-fg-secondary);\">48px height • 100px radius • Orange fill • Uppercase<\u002Fp>\n      <\u002Fdiv>\n      \n      <div class=\"accessibility-note\">\n        <h4>Button Best Practices<\u002Fh4>\n        <ul>\n          <li><strong>Minimum 44×44px touch target<\u002Fstrong> (WCAG 2.5.5)<\u002Fli>\n          <li><strong>Use semantic &lt;button&gt; elements<\u002Fstrong> for actions<\u002Fli>\n          <li><strong>Disabled state:<\u002Fstrong> Use disabled attribute<\u002Fli>\n          <li><strong>Focus indicators:<\u002Fstrong> Blue outline for keyboard users<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"inputs\" class=\"section\">\n      <h2 class=\"section-title\">Input Fields<\u002Fh2>\n      \n      <div class=\"subsection\">\n        <h3 class=\"subsection-title\">Standard Input (40px)<\u002Fh3>\n        <div style=\"max-width: 400px; margin-bottom: 16px;\">\n          <input type=\"text\" class=\"input\" placeholder=\"Enter part number\">\n        <\u002Fdiv>\n        <p style=\"font-size: 13px; color: var(--ps-fg-secondary);\">40px height • 1.5px border • Orange hover • Blue focus glow<\u002Fp>\n      <\u002Fdiv>\n      \n      <div class=\"accessibility-note\">\n        <h4>Input Field Guidelines<\u002Fh4>\n        <ul>\n          <li><strong>Always pair with &lt;label&gt;<\u002Fstrong> using for= attribute<\u002Fli>\n          <li><strong>Placeholder is not a label<\u002Fstrong> — provide visible label<\u002Fli>\n          <li><strong>Error state:<\u002Fstrong> Red border + error message 11px below<\u002Fli>\n          <li><strong>Minimum contrast:<\u002Fstrong> 4.5:1 for input text<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"selections\" class=\"section\">\n      <h2 class=\"section-title\">Checkboxes &amp; Radio Buttons<\u002Fh2>\n      \n      <div class=\"subsection\">\n        <h3 class=\"subsection-title\">Checkboxes<\u002Fh3>\n        <div style=\"display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px;\">\n          <label style=\"display: flex; align-items: center; gap: 12px; cursor: pointer;\">\n            <span class=\"checkbox\"><\u002Fspan>\n            <span>Include compatible parts<\u002Fspan>\n          <\u002Flabel>\n          <label style=\"display: flex; align-items: center; gap: 12px; cursor: pointer;\">\n            <span class=\"checkbox checked\">\n              <svg width=\"16\" height=\"12\" viewBox=\"0 0 16 12\" fill=\"none\">\n                <path d=\"M15.31 2.56a1.5 1.5 0 0 0-2.12-2.12L5.25 8.38 2.56 5.69A1.5 1.5 0 1 0 .44 7.81l3.75 3.75a1.5 1.5 0 0 0 2.12 0l9-9z\" fill=\"#fff\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fspan>\n            <span>Show original equipment only<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fdiv>\n        <p style=\"font-size: 13px; color: var(--ps-fg-secondary);\">24×24px • 2px corner radius • Orange fill when selected<\u002Fp>\n      <\u002Fdiv>\n      \n      <div class=\"subsection\">\n        <h3 class=\"subsection-title\">Radio Buttons<\u002Fh3>\n        <div style=\"display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px;\">\n          <label style=\"display: flex; align-items: center; gap: 12px; cursor: pointer;\">\n            <span class=\"radio\"><\u002Fspan>\n            <span>Option A<\u002Fspan>\n          <\u002Flabel>\n          <label style=\"display: flex; align-items: center; gap: 12px; cursor: pointer;\">\n            <span class=\"radio\" style=\"border-color: #4A4A4A;\">\n              <span style=\"width: 10px; height: 10px; background: #FF9505; border-radius: 50%;\"><\u002Fspan>\n            <\u002Fspan>\n            <span>Option B<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fdiv>\n        <p style=\"font-size: 13px; color: var(--ps-fg-secondary);\">24×24px circular • 10px inner circle when selected<\u002Fp>\n      <\u002Fdiv>\n      \n      <div class=\"accessibility-note\">\n        <h4>Selection Controls Best Practices<\u002Fh4>\n        <ul>\n          <li><strong>Minimum 44×44px touch target<\u002Fstrong> — make label clickable<\u002Fli>\n          <li><strong>Use checkboxes for multi-select,<\u002Fstrong> radio for single-select<\u002Fli>\n          <li><strong>Group with &lt;fieldset&gt; + &lt;legend&gt;<\u002Fstrong><\u002Fli>\n          <li><strong>Arrange vertically<\u002Fstrong> when possible<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"badges\" class=\"section\">\n      <h2 class=\"section-title\">Badges<\u002Fh2>\n      \n      <div class=\"subsection\">\n        <h3 class=\"subsection-title\">Status Badges<\u002Fh3>\n        <div style=\"display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;\">\n          <span class=\"badge success\">Delivered<\u002Fspan>\n          <span class=\"badge info\">In Transit<\u002Fspan>\n          <span class=\"badge warning\">Urgent<\u002Fspan>\n          <span class=\"badge critical\">Critical<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size: 13px; color: var(--ps-fg-secondary);\">4px 8px padding • 4px radius • 12px text • 1px border<\u002Fp>\n      <\u002Fdiv>\n      \n      <div class=\"accessibility-note\">\n        <h4>Badge Guidelines<\u002Fh4>\n        <ul>\n          <li><strong>Color + text:<\u002Fstrong> Never rely on color alone<\u002Fli>\n          <li><strong>Contrast:<\u002Fstrong> All badge pairs meet WCAG AA<\u002Fli>\n          <li><strong>Consistent mapping:<\u002Fstrong> Blue = progress, Green = complete, Red = critical<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"alerts\" class=\"section\">\n      <h2 class=\"section-title\">Alerts<\u002Fh2>\n      \n      <div class=\"subsection\">\n        <h3 class=\"subsection-title\">Alert Banners<\u002Fh3>\n        <div style=\"max-width: 600px;\">\n          <div class=\"alert success\">\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n              <polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline>\n            <\u002Fsvg>\n            <span style=\"font-weight: 700;\">Your quote has been sent successfully.<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"alert error\">\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n              <circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle>\n              <line x1=\"15\" y1=\"9\" x2=\"9\" y2=\"15\"><\u002Fline>\n              <line x1=\"9\" y1=\"9\" x2=\"15\" y2=\"15\"><\u002Fline>\n            <\u002Fsvg>\n            <span style=\"font-weight: 700;\">Unable to process request. Please try again.<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"alert warning\">\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n              <path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"><\u002Fpath>\n              <line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline>\n              <line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline>\n            <\u002Fsvg>\n            <span style=\"font-weight: 700;\">Shipment delayed. Expected delivery: Tomorrow.<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"alert info\">\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n              <circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle>\n              <line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"><\u002Fline>\n              <line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"><\u002Fline>\n            <\u002Fsvg>\n            <span style=\"font-weight: 700;\">New parts available for this equipment model.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      \n      <div class=\"accessibility-note\">\n        <h4>Alert Best Practices<\u002Fh4>\n        <ul>\n          <li><strong>Use role=\"alert\"<\u002Fstrong> for critical alerts<\u002Fli>\n          <li><strong>Icons are decorative:<\u002Fstrong> Add aria-hidden=\"true\"<\u002Fli>\n          <li><strong>Dismissible alerts:<\u002Fstrong> Include close button with aria-label<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"cards\" class=\"section\">\n      <h2 class=\"section-title\">Cards<\u002Fh2>\n      \n      <div class=\"subsection\">\n        <h3 class=\"subsection-title\">Product Card<\u002Fh3>\n        <div class=\"card\" style=\"max-width: 500px;\">\n          <div class=\"card-body\">\n            <div style=\"display: flex; justify-content: space-between; margin-bottom: 16px;\">\n              <a href=\"#\" style=\"font-size: 14px; color: #777; text-decoration: none;\">View Details<\u002Fa>\n              <span style=\"font-size: 13px; font-weight: 700; color: #000; text-transform: uppercase;\">CREATED 04/21/2026<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"font-size: 16px; font-weight: 700; color: #005DA6; margin: 0 0 24px;\">\n              <a href=\"#\" style=\"color: #005DA6; text-decoration: none;\">PATIENT CABLE, SPO2 SPOT CHECK<\u002Fa>\n            <\u002Fh3>\n            <div style=\"display: flex; gap: 24px;\">\n              <div style=\"width: 100px; height: 100px; background: #F5F5F5; border: 1px solid #E5E5E5; border-radius: 4px;\"><\u002Fdiv>\n              <div style=\"font-size: 16px; line-height: 1.5;\">\n                <div><span>Facility:<\u002Fspan> <span style=\"font-weight: 600;\">Chatham Memorial<\u002Fspan><\u002Fdiv>\n                <div><span>Ref #:<\u002Fspan> <span style=\"font-weight: 600;\">9535566<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      \n      <div class=\"accessibility-note\">\n        <h4>Card Best Practices<\u002Fh4>\n        <ul>\n          <li><strong>Make entire card focusable<\u002Fstrong> if interactive<\u002Fli>\n          <li><strong>Use headings for titles<\u002Fstrong> for screen readers<\u002Fli>\n          <li><strong>Images require alt text<\u002Fstrong><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer style=\"margin-top: 80px; padding-top: 40px; border-top: 1px solid var(--ps-border-default); color: var(--ps-fg-secondary); font-size: 13px;\">\n      <p>PartsSource Design System — Complete Visual Reference<\u002Fp>\n      <p style=\"margin-top: 8px;\">© 2026 PartsSource. All rights reserved.<\u002Fp>\n    <\u002Ffooter>\n\n  <\u002Fmain>\n\n  <script>\n    document.querySelectorAll('.nav-link').forEach(link => {\n      link.addEventListener('click', (e) => {\n        e.preventDefault();\n        const target = document.querySelector(link.getAttribute('href'));\n        if (target) {\n          target.scrollIntoView({ behavior: 'smooth', block: 'start' });\n          document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));\n          link.classList.add('active');\n        }\n      });\n    });\n    \n    const sections = document.querySelectorAll('.section');\n    const navLinks = document.querySelectorAll('.nav-link');\n    \n    window.addEventListener('scroll', () => {\n      let current = '';\n      sections.forEach(section => {\n        const sectionTop = section.offsetTop;\n        if (window.pageYOffset >= sectionTop - 100) {\n          current = section.getAttribute('id');\n        }\n      });\n      \n      navLinks.forEach(link => {\n        link.classList.remove('active');\n        if (link.getAttribute('href') === '#' + current) {\n          link.classList.add('active');\n        }\n      });\n    });\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
