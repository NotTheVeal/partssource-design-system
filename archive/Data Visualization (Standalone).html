document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

link:#005BA6;\n  --border:#DCDCDC;\n  --font:'Source Sans Pro',-apple-system,sans-serif;\n  --mono:'SF Mono',Consolas,monospace;\n  --sh-md:0 2px 10px rgba(0,47,72,.10);\n}\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:var(--font);background:var(--n50);color:var(--fg);font-size:15px;line-height:1.5;padding:40px 40px 80px}\n/* header */\n.page-hd{max-width:1200px;margin:0 auto 40px}\n.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg2);margin-bottom:14px}\n.crumb a{color:var(--link);text-decoration:none}.crumb a:hover{text-decoration:underline}\nh1{font-size:30px;font-weight:300;color:var(--b900);letter-spacing:-.3px;margin-bottom:8px}\n.pdesc{font-size:15px;color:var(--fg2);max-width:700px;line-height:1.6}\n/* section */\n.sec{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;margin:0 auto 32px;max-width:1200px}\n.sh{padding:15px 24px;border-bottom:1px solid var(--border);background:var(--n50);display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}\n.sh h2{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--b500);font-weight:700;white-space:nowrap}\n.sh .sd{font-size:12px;color:var(--fg2)}\n.sb{padding:24px}\n/* chart card */\n.cc{background:#fff;border:1px solid var(--border);border-radius:4px;overflow:hidden;transition:box-shadow 200ms ease;display:flex;flex-direction:column}\n.cc:hover{box-shadow:0 4px 12px rgba(0,47,72,.10)}\n.ch{padding:14px 18px 0;display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0}\n.ct{font-size:13px;font-weight:600;color:var(--b900)}\n.cs{font-size:11px;color:var(--fg2);margin-top:2px}\n.cb{padding:12px 18px 18px;flex:1;min-height:0}\n/* legend */\n.leg{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px;font-size:11px;color:var(--fg2)}\n.leg span{display:flex;align-items:center;gap:5px}\n.ld{width:10px;height:10px;border-radius:2px;flex-shrink:0}\n/* canvas wrap */\n.cw{position:relative;width:100%}\n/* grids */\n.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}\n.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}\n.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}\n.gm{display:grid;grid-template-columns:2fr 1fr;gap:20px}\n/* kpi */\n.kpi{background:var(--n50);border-radius:4px;padding:14px 16px}\n.kl{font-size:11px;color:var(--fg2);margin-bottom:4px}\n.kv{font-size:22px;font-weight:700;color:var(--b900);line-height:1}\n.kd{font-size:11px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:3px}\n.kd.up{color:#0E7C55}.kd.dn{color:#E00000}\n/* swatches */\n.swrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}\n.sw{width:56px;text-align:center}\n.swb{height:40px;border-radius:4px;border:1px solid rgba(0,0,0,.06);margin-bottom:4px}\n.swh{font-size:9px;color:var(--fg2);font-family:var(--mono)}\n.swn{font-size:9px;color:var(--fg3)}\n/* tok */\n.tok{display:inline-block;font-family:var(--mono);font-size:11px;color:#2B2B2B;background:var(--n100);padding:2px 6px;border-radius:3px}\n/* comp label */\n.cn{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--fg2);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}\n/* spec table */\n.st{width:100%;border-collapse:collapse;font-size:12px}\n.st th{text-align:left;padding:7px 12px;background:var(--n50);border-bottom:1px solid var(--border);font-weight:600;color:var(--fg2);font-size:10px;text-transform:uppercase;letter-spacing:.5px}\n.st td{padding:9px 12px;border-bottom:1px solid var(--n100);vertical-align:top}\n.st tr:last-child td{border-bottom:none}\n.st td:first-child{font-weight:600}\n/* tooltip demo */\n.ttd{background:#fff;border:1px solid var(--border);border-radius:4px;padding:10px 14px;box-shadow:var(--sh-md);display:inline-block;font-size:12px}\n.ttl{color:var(--fg2);margin-bottom:6px;font-weight:600}\n.ttr{display:flex;align-items:center;gap:6px;margin-bottom:3px}\n.ttdot{width:8px;height:8px;border-radius:2px;flex-shrink:0}\n.ttn{color:var(--fg2);flex:1}.ttv{font-weight:700;color:var(--fg)}\n/* code */\npre{background:#F5F5F5;padding:20px;border-radius:4px;overflow-x:auto}\ncode{font-family:var(--mono);font-size:12px;color:#2B2B2B;line-height:1.7}\n/* sep */\n.sep{height:1px;background:var(--border);margin:20px 0}\n@media(max-width:960px){.g2,.g3,.g4,.gm{grid-template-columns:1fr}body{padding:24px 20px 60px}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- PAGE HEADER -->\n<header class=\"page-hd\">\n  <nav class=\"crumb\">\n    <a href=\"#\">PS Design Library<\u002Fa>\n    <i data-lucide=\"chevron-right\" style=\"width:13px;height:13px;\"><\u002Fi>\n    <span>Data Visualization<\u002Fspan>\n  <\u002Fnav>\n  <h1>Data Visualization<\u002Fh1>\n  <p class=\"pdesc\">Chart components, series color tokens, axis conventions, tooltip anatomy and component naming — all built on the PS blue scale. Use Recharts or Nivo with <span class=\"tok\">psNivoTheme<\u002Fspan> for consistent styling.<\u002Fp>\n<\u002Fheader>\n\n<!-- 1. SERIES PALETTE -->\n<section class=\"sec\">\n  <div class=\"sh\"><h2>Series Color Palette<\u002Fh2><span class=\"sd\">PS blue scale — apply in this order across all chart series<\u002Fspan><\u002Fdiv>\n  <div class=\"sb\">\n    <div class=\"swrow\">\n      <div class=\"sw\"><div class=\"swb\" style=\"background:#005BA6\"><\u002Fdiv><div class=\"swh\">#005BA6<\u002Fdiv><div class=\"swn\">Blue 500<\u002Fdiv><div class=\"swn\" style=\"color:var(--b500);font-weight:700\">S1<\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"swb\" style=\"background:#1A6FB5\"><\u002Fdiv><div class=\"swh\">#1A6FB5<\u002Fdiv><div class=\"swn\">Blue 400<\u002Fdiv><div class=\"swn\" style=\"color:var(--b500);font-weight:700\">S2<\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"swb\" style=\"background:#4D90C8\"><\u002Fdiv><div class=\"swh\">#4D90C8<\u002Fdiv><div class=\"swn\">Blue 300<\u002Fdiv><div class=\"swn\" style=\"color:var(--b500);font-weight:700\">S3<\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"swb\" style=\"background:#009CF4\"><\u002Fdiv><div class=\"swh\">#009CF4<\u002Fdiv><div class=\"swn\">Blue 200<\u002Fdiv><div class=\"swn\" style=\"color:var(--b500);font-weight:700\">S4<\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"swb\" style=\"background:#B0C6D3\"><\u002Fdiv><div class=\"swh\">#B0C6D3<\u002Fdiv><div class=\"swn\">Blue 50<\u002Fdiv><div class=\"swn\" style=\"color:var(--b500);font-weight:700\">S5<\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"swb\" style=\"background:#DCEAED;border:1px solid #ccc\"><\u002Fdiv><div class=\"swh\">#DCEAED<\u002Fdiv><div class=\"swn\">Blue 100<\u002Fdiv><div class=\"swn\" style=\"color:var(--b500);font-weight:700\">S6<\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\" style=\"margin-left:12px\"><div class=\"swb\" style=\"background:#002F48\"><\u002Fdiv><div class=\"swh\">#002F48<\u002Fdiv><div class=\"swn\">Blue 900<\u002Fdiv><div class=\"swn\">Emphasis<\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"swb\" style=\"background:#004A84\"><\u002Fdiv><div class=\"swh\">#004A84<\u002Fdiv><div class=\"swn\">Blue 700<\u002Fdiv><div class=\"swn\">Hover<\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\" style=\"margin-left:12px\"><div class=\"swb\" style=\"background:#17AB78\"><\u002Fdiv><div class=\"swh\">#17AB78<\u002Fdiv><div class=\"swn\">Success<\u002Fdiv><div class=\"swn\">Positive<\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"swb\" style=\"background:#E3A92D\"><\u002Fdiv><div class=\"swh\">#E3A92D<\u002Fdiv><div class=\"swn\">Warning<\u002Fdiv><div class=\"swn\">At-risk<\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"swb\" style=\"background:#E00000\"><\u002Fdiv><div class=\"swh\">#E00000<\u002Fdiv><div class=\"swn\">Danger<\u002Fdiv><div class=\"swn\">Negative<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <pre><code>export const PS_SERIES = ['#005BA6','#1A6FB5','#4D90C8','#009CF4','#B0C6D3','#DCEAED'];\n// Semantic overrides\nexport const PS_POSITIVE = '#17AB78'; // success — revenue up, delivered, approved\nexport const PS_WARNING  = '#E3A92D'; // at-risk — delayed, expiring, threshold\nexport const PS_NEGATIVE = '#E00000'; // danger  — cost, loss, failed, overdue<\u002Fcode><\u002Fpre>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 2. BAR CHART -->\n<section class=\"sec\">\n  <div class=\"sh\"><h2>BarChart<\u002Fh2><span class=\"sd\">Vertical · grouped · @nivo/bar · DataViz/BarChart<\u002Fspan><\u002Fdiv>\n  <div class=\"sb\">\n    <div class=\"g2\">\n      <div class=\"cc\">\n        <div class=\"ch\"><div><div class=\"ct\">Monthly Revenue<\u002Fdiv><div class=\"cs\">Jan – Aug 2025 · USD thousands<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"cb\">\n          <div class=\"leg\"><span><span class=\"ld\" style=\"background:#005BA6\"><\u002Fspan>Revenue<\u002Fspan><\u002Fdiv>\n          <div class=\"cw\" style=\"height:220px\"><canvas id=\"bar1\" role=\"img\" aria-label=\"Monthly revenue bar chart Jan–Aug 2025\">Revenue data.<\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cc\">\n        <div class=\"ch\"><div><div class=\"ct\">Revenue · Cost · Profit<\u002Fdiv><div class=\"cs\">Grouped bars · Jan – Aug 2025<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"cb\">\n          <div class=\"leg\">\n            <span><span class=\"ld\" style=\"background:#005BA6\"><\u002Fspan>Revenue<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#4D90C8\"><\u002Fspan>Cost<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#009CF4\"><\u002Fspan>Profit<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"cw\" style=\"height:220px\"><canvas id=\"bar2\" role=\"img\" aria-label=\"Grouped bar chart revenue cost profit\">Grouped data.<\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 3. LINE + AREA -->\n<section class=\"sec\">\n  <div class=\"sh\"><h2>LineChart · AreaChart<\u002Fh2><span class=\"sd\">Continuous trends over time · @nivo/line · DataViz/LineChart<\u002Fspan><\u002Fdiv>\n  <div class=\"sb\">\n    <div class=\"g2\">\n      <div class=\"cc\">\n        <div class=\"ch\"><div><div class=\"ct\">Multi-Series Line<\u002Fdiv><div class=\"cs\">Revenue, cost and profit trend<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"cb\">\n          <div class=\"leg\">\n            <span><span class=\"ld\" style=\"background:#005BA6\"><\u002Fspan>Revenue<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#4D90C8\"><\u002Fspan>Cost<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#009CF4\"><\u002Fspan>Profit<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"cw\" style=\"height:220px\"><canvas id=\"line1\" role=\"img\" aria-label=\"Multi-series line chart\">Line data.<\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cc\">\n        <div class=\"ch\"><div><div class=\"ct\">Area Chart<\u002Fdiv><div class=\"cs\">Revenue with forecast · filled area<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"cb\">\n          <div class=\"leg\">\n            <span><span class=\"ld\" style=\"background:#005BA6\"><\u002Fspan>Revenue<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#009CF4;border:1px dashed #009CF4;background:transparent\"><\u002Fspan>Forecast<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"cw\" style=\"height:220px\"><canvas id=\"area1\" role=\"img\" aria-label=\"Area chart revenue and forecast\">Area data.<\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 4. PIE + DONUT -->\n<section class=\"sec\">\n  <div class=\"sh\"><h2>PieChart · DonutChart<\u002Fh2><span class=\"sd\">Part-to-whole · max 6 segments · @nivo/pie · DataViz/PieChart<\u002Fspan><\u002Fdiv>\n  <div class=\"sb\">\n    <div class=\"g2\">\n      <div class=\"cc\">\n        <div class=\"ch\"><div><div class=\"ct\">Revenue by Channel<\u002Fdiv><div class=\"cs\">Pie · YTD share<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"cb\">\n          <div class=\"cw\" style=\"height:240px\"><canvas id=\"pie1\" role=\"img\" aria-label=\"Pie chart revenue by channel\">Pie data.<\u002Fcanvas><\u002Fdiv>\n          <div class=\"leg\" style=\"justify-content:center;margin-top:10px;margin-bottom:0\">\n            <span><span class=\"ld\" style=\"background:#005BA6\"><\u002Fspan>Direct 38%<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#1A6FB5\"><\u002Fspan>Organic 27%<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#4D90C8\"><\u002Fspan>Referral 19%<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#009CF4\"><\u002Fspan>Social 11%<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#B0C6D3\"><\u002Fspan>Email 5%<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cc\">\n        <div class=\"ch\"><div><div class=\"ct\">Revenue by Channel<\u002Fdiv><div class=\"cs\">Donut · 62% cutout · center label<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"cb\">\n          <div class=\"cw\" style=\"height:240px\"><canvas id=\"donut1\" role=\"img\" aria-label=\"Donut chart revenue by channel\">Donut data.<\u002Fcanvas><\u002Fdiv>\n          <div class=\"leg\" style=\"justify-content:center;margin-top:10px;margin-bottom:0\">\n            <span><span class=\"ld\" style=\"background:#005BA6\"><\u002Fspan>Direct 38%<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#1A6FB5\"><\u002Fspan>Organic 27%<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#4D90C8\"><\u002Fspan>Referral 19%<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#009CF4\"><\u002Fspan>Social 11%<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#B0C6D3\"><\u002Fspan>Email 5%<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 5. SCATTER + BUBBLE -->\n<section class=\"sec\">\n  <div class=\"sh\"><h2>ScatterPlot · BubbleChart<\u002Fh2><span class=\"sd\">Correlation between two continuous variables · @nivo/scatterplot · DataViz/ScatterPlot<\u002Fspan><\u002Fdiv>\n  <div class=\"sb\">\n    <div class=\"g2\">\n      <div class=\"cc\">\n        <div class=\"ch\"><div><div class=\"ct\">Order Value vs Lead Time<\u002Fdiv><div class=\"cs\">3 supplier tiers · n=120 orders<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"cb\">\n          <div class=\"leg\">\n            <span><span class=\"ld\" style=\"background:#005BA6\"><\u002Fspan>Tier 1<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#4D90C8\"><\u002Fspan>Tier 2<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#009CF4\"><\u002Fspan>Tier 3<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"cw\" style=\"height:240px\"><canvas id=\"scatter1\" role=\"img\" aria-label=\"Scatter plot order value vs lead time\">Scatter data.<\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cc\">\n        <div class=\"ch\"><div><div class=\"ct\">Price Index vs Fill Rate<\u002Fdiv><div class=\"cs\">Bubble size = order volume · 4 categories<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"cb\">\n          <div class=\"leg\">\n            <span><span class=\"ld\" style=\"background:#005BA6\"><\u002Fspan>Imaging<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#1A6FB5\"><\u002Fspan>Surgical<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#4D90C8\"><\u002Fspan>ICU<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#009CF4\"><\u002Fspan>Lab<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"cw\" style=\"height:240px\"><canvas id=\"bubble1\" role=\"img\" aria-label=\"Bubble chart price vs fill rate\">Bubble data.<\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 6. RADAR -->\n<section class=\"sec\">\n  <div class=\"sh\"><h2>RadarChart<\u002Fh2><span class=\"sd\">Multi-attribute comparison · max 4 entities · @nivo/radar · DataViz/RadarChart<\u002Fspan><\u002Fdiv>\n  <div class=\"sb\">\n    <div class=\"g2\">\n      <div class=\"cc\">\n        <div class=\"ch\"><div><div class=\"ct\">Supplier Scorecard<\u002Fdiv><div class=\"cs\">3 suppliers across 6 performance KPIs<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"cb\">\n          <div class=\"leg\">\n            <span><span class=\"ld\" style=\"background:#005BA6\"><\u002Fspan>Supplier A<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#4D90C8\"><\u002Fspan>Supplier B<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#009CF4\"><\u002Fspan>Supplier C<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"cw\" style=\"height:280px\"><canvas id=\"radar1\" role=\"img\" aria-label=\"Radar chart supplier scorecard 6 KPIs\">Radar data.<\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"cn\" style=\"margin-bottom:16px\">RadarChart spec<\u002Fdiv>\n        <table class=\"st\">\n          <thead><tr><th>Property<\u002Fth><th>Value<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td>Max entities<\u002Ftd><td>4 (readability degrades beyond 4)<\u002Ftd><\u002Ftr>\n            <tr><td>Axes<\u002Ftd><td>5–8 recommended; minimum 3<\u002Ftd><\u002Ftr>\n            <tr><td>Fill opacity<\u002Ftd><td><span class=\"tok\">0.12<\u002Fspan> per series<\u002Ftd><\u002Ftr>\n            <tr><td>Line width<\u002Ftd><td><span class=\"tok\">2px<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Point size<\u002Ftd><td><span class=\"tok\">4px<\u002Fspan> · <span class=\"tok\">6px<\u002Fspan> on hover<\u002Ftd><\u002Ftr>\n            <tr><td>Grid color<\u002Ftd><td><span class=\"tok\">#DCDCDC<\u002Fspan> --ps-border-default<\u002Ftd><\u002Ftr>\n            <tr><td>Tick labels<\u002Ftd><td><span class=\"tok\">11px / 400 / #777777<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Series 1<\u002Ftd><td><span class=\"tok\">#005BA6<\u002Fspan> --ps-blue-500<\u002Ftd><\u002Ftr>\n            <tr><td>Series 2<\u002Ftd><td><span class=\"tok\">#4D90C8<\u002Fspan> --ps-blue-300<\u002Ftd><\u002Ftr>\n            <tr><td>Series 3<\u002Ftd><td><span class=\"tok\">#009CF4<\u002Fspan> --ps-blue-200<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 7. HEATMAP -->\n<section class=\"sec\">\n  <div class=\"sh\"><h2>HeatMap<\u002Fh2><span class=\"sd\">2D intensity · PS blue sequential scale · @nivo/heatmap · DataViz/HeatMap<\u002Fspan><\u002Fdiv>\n  <div class=\"sb\">\n    <div class=\"cc\">\n      <div class=\"ch\"><div><div class=\"ct\">Order Activity by Day &amp; Hour<\u002Fdiv><div class=\"cs\">Orders placed · Mon–Fri · 6am–9pm · darker = higher volume<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"cb\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:11px;color:var(--fg2)\">\n          <span>Low<\u002Fspan>\n          <div style=\"display:flex;gap:2px\">\n            <div style=\"width:20px;height:12px;background:#DCEAED;border-radius:2px\"><\u002Fdiv>\n            <div style=\"width:20px;height:12px;background:#B0C6D3;border-radius:2px\"><\u002Fdiv>\n            <div style=\"width:20px;height:12px;background:#4D90C8;border-radius:2px\"><\u002Fdiv>\n            <div style=\"width:20px;height:12px;background:#1A6FB5;border-radius:2px\"><\u002Fdiv>\n            <div style=\"width:20px;height:12px;background:#005BA6;border-radius:2px\"><\u002Fdiv>\n            <div style=\"width:20px;height:12px;background:#002F48;border-radius:2px\"><\u002Fdiv>\n          <\u002Fdiv>\n          <span>High<\u002Fspan>\n        <\u002Fdiv>\n        <div id=\"heatmap-grid\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 8. FUNNEL -->\n<section class=\"sec\">\n  <div class=\"sh\"><h2>FunnelChart<\u002Fh2><span class=\"sd\">Drop-off across sequential steps · @nivo/funnel · DataViz/FunnelChart<\u002Fspan><\u002Fdiv>\n  <div class=\"sb\">\n    <div class=\"g2\">\n      <div class=\"cc\">\n        <div class=\"ch\"><div><div class=\"ct\">Procurement Funnel<\u002Fdiv><div class=\"cs\">Requisition → PO → Receipt · Q3 2025<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"cb\"><div id=\"funnel1\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cc\">\n        <div class=\"ch\"><div><div class=\"ct\">Approval Pipeline<\u002Fdiv><div class=\"cs\">Submitted → Approved → Fulfilled<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"cb\"><div id=\"funnel2\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 9. WAFFLE -->\n<section class=\"sec\">\n  <div class=\"sh\"><h2>WaffleChart<\u002Fh2><span class=\"sd\">Proportional grid · 10×10 cells · @nivo/waffle · DataViz/WaffleChart<\u002Fspan><\u002Fdiv>\n  <div class=\"sb\">\n    <div class=\"cc\" style=\"max-width:480px\">\n      <div class=\"ch\"><div><div class=\"ct\">Contract Status<\u002Fdiv><div class=\"cs\">100 active contracts<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"cb\">\n        <div class=\"leg\">\n          <span><span class=\"ld\" style=\"background:#005BA6\"><\u002Fspan>Active 68%<\u002Fspan>\n          <span><span class=\"ld\" style=\"background:#4D90C8\"><\u002Fspan>Pending 14%<\u002Fspan>\n          <span><span class=\"ld\" style=\"background:#B0C6D3\"><\u002Fspan>Expired 12%<\u002Fspan>\n          <span><span class=\"ld\" style=\"background:#DCEAED;border:1px solid #ccc\"><\u002Fspan>Draft 6%<\u002Fspan>\n        <\u002Fdiv>\n        <div id sh\"><h2>StreamChart<\u002Fh2><span class=\"sd\">Volume evolution across categories · stacked area · @nivo/stream · DataViz/StreamChart<\u002Fspan><\u002Fdiv>\n  <div class=\"sb\">\n    <div class=\"cc\">\n      <div class=\"ch\"><div><div class=\"ct\">Order Volume by Category<\u002Fdiv><div class=\"cs\">12 months · silhouette offset<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"cb\">\n        <div class=\"leg\">\n          <span><span class=\"ld\" style=\"background:#005BA6\"><\u002Fspan>Imaging<\u002Fspan>\n          <span><span class=\"ld\" style=\"background:#1A6FB5\"><\u002Fspan>Surgical<\u002Fspan>\n          <span><span class=\"ld\" style=\"background:#4D90C8\"><\u002Fspan>ICU<\u002Fspan>\n          <span><span class=\"ld\" style=\"background:#009CF4\"><\u002Fspan>Lab<\u002Fspan>\n          <span><span class=\"ld\" style=\"background:#B0C6D3\"><\u002Fspan>Cardio<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"cw\" style=\"height:260px\"><canvas id=\"stream1\" role=\"img\" aria-label=\"Stream chart order volume by category 12 months\">Stream data.<\u002Fcanvas><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 13. DASHBOARD LAYOUT PATTERN -->\n<section class=\"sec\">\n  <div class=\"sh\"><h2>Dashboard Layout Pattern<\u002Fh2><span class=\"sd\">1:1 from Figma · Visual Analytics 2025 · components 1318-20651, 1318-20723, 1325-61469, 1318-4691<\u002Fspan><\u002Fdiv>\n  <div class=\"sb\">\n\n<style>\n/* ─── 13A Long Top Card ─── */\n.ltc-wrap { background:#fff; border:1px solid #DCDCDC; border-radius:4px; overflow:hidden; margin-bottom:16px; }\n.ltc-header { display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-bottom:1px solid #DCDCDC; }\n.ltc-header-left { display:flex; align-items:center; gap:8px; font-size:13px; color:#4A4A4A; }\n.ltc-header-right { display:flex; align-items:center; gap:6px; }\n.ltc-btn-blue { display:inline-flex; align-items:center; gap:5px; font-size:12px; \" style=\"font-weight:600;color:#4A4A4A\">Profit<\u002Fspan>\n            <span class=\"ttv\" style=\"color:#17AB78\">$280k<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"cn\">Tooltip tokens<\u002Fdiv>\n        <table class=\"st\">\n          <thead><tr><th>Property<\u002Fth><th>Value<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td>Background<\u002Ftd><td><span class=\"tok\">#FFFFFF<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Border<\u002Ftd><td><span class=\"tok\">1px solid #DCDCDC<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Radius<\u002Ftd><td><span class=\"tok\">4px --ps-radius-md<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Shadow<\u002Ftd><td><span class=\"tok\">--ps-shadow-md<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Padding<\u002Ftd><td><span class=\"tok\">10px 14px<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Label<\u002Ftd><td><span class=\"tok\">12px / 600 / #777777<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Series name<\u002Ftd><td><span class=\"tok\">12px / 400 / #777777<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Value<\u002Ftd><td><span class=\"tok\">12px / 700 / #4A4A4A<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Series dot<\u002Ftd><td><span class=\"tok\">8×8px / radius: 2px<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Font<\u002Ftd><td><span class=\"tok\">Source Sans Pro<\u002Fspan><\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 15. NIVO THEME -->\n<section class=\"sec\">\n  <div class=\"sh\"><h2>Nivo Theme Config<\u002Fh2><span class=\"sd\">Drop-in <span class=\"tok\" style=\"font-size:10px\">psNivoTheme<\u002Fspan> — pass as <code style=\"font-size:11px\">theme<\u002Fcode> prop to every Nivo chart<\u002Fspan><\u002Fdiv>\n  <div class=\"sb\">\n    <pre><code>export const psNivoTheme = {\n  background: 'transparent',\n  textColor: '#4A4A4A',            // --ps-fg-primary\n  fontSize: 12,\n  fontFamily: \"'Source Sans Pro', sans-serif\",\n  axis: {\n    ticks:  { text: { fill: '#777777', fontSize: 11 } },  // --ps-fg-secondary\n    legend: { text: { fill: '#4A4A4A', fontSize: 12, fontWeight: 600 } }\n  },\n  grid: { line: { stroke: '#DCDCDC', strokeWidth: 1 } },  // --ps-border-default\n  legends: { text: { fill: '#4A4A4A', fontSize: 11 } },\n  tooltip: {\n    container: {\n      background: '#FFFFFF', color: '#4A4A4A', fontSize: 12,\n      borderRadius: 4, border: '1px solid #DCDCDC',\n      boxShadow: '0 2px 10px rgba(0,47,72,0.10)',         // --ps-shadow-md\n      fontFamily: \"'Source Sans Pro', sans-serif\"\n    }\n  }\n};<\u002Fcode><\u002Fpre>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<script>\ndocument.addEventListener('DOMContentLoaded', function() {\n\n/* ─── Palette ─── */\nconst B = {\n  b900:'#002F48', b800:'#003870', b700:'#004A84', b600:'#004E94',\n  b500:'#005BA6', b400:'#1A6FB5', b300:'#4D90C8', b200:'#009CF4',\n  b100:'#DCEAED', b50:'#B0C6D3',\n  ok:'#17AB78', warn:'#E3A92D', err:'#E00000',\n  fg:'#4A4A4A', fg2:'#777777', grid:'#DCDCDC', white:'#FFFFFF'\n};\nconst S = [B.b500,B.b400,B.b300,B.b200,B.b50,B.b100];\n\n/* ─── Axis defaults ─── */\nconst XA = { grid:{display:false}, ticks:{color:B.fg2,font:{size:11,family:\"'Source Sans Pro'\"}}, border:{display:false} };\nconst YA = { grid:{color:B.grid,lineWidth:1}, ticks:{color:B.fg2,font:{size:11,family:\"'Source Sans Pro'\"}}, border:{display:false} };\nconst NL = { plugins:{legend:{display:false}} };\nfunction pt(c){ return {pointBackgroundColor:B.white,pointBorderColor:c,pointRadius:4,pointHoverRadius:6,pointBorderWidth:2}; }\nfunction yk(v){ return '$'+v+'k'; }\n\n/* ─── Data ─── */\nconst MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'];\nconst RV = [420,510,390,630,580,720,680,750];\nconst CO = [280,310,260,350,330,400,380,410];\nconst PR = [140,200,130,280,250,320,300,340];\nfunction scatter(n,cx,cy,sp){ return Array.from({length:n},()=>({x:+(cx+(Math.random()-.5)*sp*2).toFixed(1),y:+(cy+(Math.random()-.5)*sp*2).toFixed(1)})); }\n\n/* ════ 2. BAR ════ */\nnew Chart('bar1',{type:'bar',data:{labels:MO,datasets:[{label:'Revenue',data:RV,backgroundColor:B.b500,borderRadius:3,hoverBackgroundColor:B.b700}]},options:{responsive:true,maintainAspectRatio:false,...NL,scales:{x:XA,y:{...YA,ticks:{...YA.ticks,callback:yk}}}}});\nnew Chart('bar2',{type:'bar',data:{labels:MO,datasets:[{label:'Revenue',data:RV,backgroundColor:B.b500,borderRadius:3},{label:'Cost',data:CO,backgroundColor:B.b300,borderRadius:3},{label:'Profit',data:PR,backgroundColor:B.b200,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,...NL,scales:{x:XA,y:{...YA,ticks:{...YA.ticks,callback:yk}}}}});\n\n/* ════ 3. LINE + AREA ════ */\nnew Chart('line1',{type:'line',data:{labels:MO,datasets:[{label:'Revenue',data:RV,borderColor:B.b500,borderWidth:2,tension:.35,fill:false,...pt(B.b500)},{label:'Cost',data:CO,borderColor:B.b300,borderWidth:2,tension:.35,fill:false,...pt(B.b300)},{label:'Profit',data:PR,borderColor:B.b200,borderWidth:2,tension:.35,fill:false,...pt(B.b200)}]},options:{responsive:true,maintainAspectRatio:false,...NL,scales:{x:XA,y:{...YA,ticks:{...YA.ticks,callback:yk}}}}});\nconst FC = RV.map(v=>Math.round(v*1.09));\nnew Chart('area1',{type:'line',data:{labels:MO,datasets:[{label:'Revenue',data:RV,borderColor:B.b500,borderWidth:2,tension:.35,fill:true,backgroundColor:'rgba(0,91,166,0.13)',...pt(B.b500)},{label:'Forecast',data:FC,borderColor:B.b200,borderWidth:2,tension:.35,fill:false,borderDash:[5,4],...pt(B.b200)}]},options:{responsive:true,maintainAspectRatio:false,...NL,scales:{x:XA,y:{...YA,ticks:{...YA.ticks,callback:yk}}}}});\n\n/* ════ 4. PIE + DONUT ════ */\nconst PC = [B.b500,B.b400,B.b300,B.b200,B.b50];\nconst PD = {labels:['Direct','Organic','Referral','Social','Email'],datasets:[{data:[38,27,19,11,5],backgroundColor:PC,borderWidth:2,borderColor:B.white,hoverOffset:6}]};\nnew Chart('pie1',{type:'pie',data:PD,options:{responsive:true,maintainAspectRatio:false,...NL}});\nnew Chart('donut1',{type:'doughnut',data:PD,options:{responsive:true,maintainAspectRatio:false,cutout:'62%',...NL}});\n\n/* ════ 5. SCATTER + BUBBLE ════ */\nnew Chart('scatter1',{type:'scatter',data:{datasets:[{label:'Tier 1',data:scatter(30,25,80,15),backgroundColor:B.b500+'cc',pointRadius:5},{label:'Tier 2',data:scatter(25,55,60,20),backgroundColor:B.b300+'cc',pointRadius:5},{label:'Tier 3',data:scatter(20,75,40,18),backgroundColor:B.b200+'cc',pointRadius:5}]},options:{responsive:true,maintainAspectRatio:false,...NL,scales:{x:{...XA,title:{display:true,text:'Order Value ($k)',color:B.fg2,font:{size:11}}},y:{...YA,title:{display:true,text:'Lead Time (days)',color:B.fg2,font:{size:11}}}}}});\nnew Chart('bubble1',{type:'bubble',data:{datasets:[{label:'Imaging',data:[{x:80,y:92,r:16}],backgroundColor:B.b500+'bb'},{label:'Surgical',data:[{x:65,y:85,r:20}],backgroundColor:B.b400+'bb'},{label:'ICU',data:[{x:45,y:78,r:11}],backgroundColor:B.b300+'bb'},{label:'Lab',data:[{x:30,y:70,r:9}],backgroundColor:B.b200+'bb'}]},options:{responsive:true,maintainAspectRatio:false,...NL,scales:{x:{...XA,min:10,max:100,title:{display:true,text:'Price Index',color:B.fg2,font:{size:11}}},y:{...YA,min:50,max:110,title:{display:true,text:'Fill Rate %',color:B.fg2,font:{size:11}}}}}});\n\n/* ════ 6. RADAR ════ */\nnew Chart('radar1',{type:'radar',data:{labels:['Quality','Delivery','Pricing','Support','Compliance','Innovation'],datasets:[{label:'Supplier A',data:[88,76,64,80,90,72],borderColor:B.b500,backgroundColor:B.b500+'1f',borderWidth:2,pointBackgroundColor:B.b500,pointRadius:3},{label:'Supplier B',data:[72,85,78,65,82,88],borderColor:B.b300,backgroundColor:B.b300+'1f',borderWidth:2,pointBackgroundColor:B.b300,pointRadius:3},{label:'Supplier C',data:[60,70,91,74,68,55],borderColor:B.b200,backgroundColor:B.b200+'1f',borderWidth:2,pointBackgroundColor:B.b200,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,...NL,scales:{r:{grid:{color:B.grid},angleLines:{color:B.grid},pointLabels:{color:B.fg2,font:{size:11,family:\"'Source Sans Pro'\"}},ticks:{color:B.fg2,font:{size:9},backdropColor:'transparent',stepSize:20},min:0,max:100}}}});\n\n/* ════ 7. HEATMAP ════ */\n(function(){\n  const days=['Mon','Tue','Wed','Thu','Fri'];\n  const hrs=['6am','8am','10am','12pm','2pm','4pm','6pm','8pm'];\n  const pal=[B.b100,B.b50,B.b300,B.b400,B.b500,B.b700];\n  const raw=days.map(()=>hrs.map(()=>Math.floor(Math.random()*6)));\n  const el=document.getElementById('heatmap-grid');\n  const lW=44,lH=22,cW=46,cH=30,gap=4;\n  const W=lW+hrs.length*(cW+gap),H=lH+days.length*(cH+gap);\n  let s=`<svg viewBox=\"0 0 ${W} ${H}\" width=\"${W}\" height=\"${H}\" style=\"font-family:'Source Sans Pro',sans-serif;max-width:100%;height:auto\">`;\n  hrs.forEach((h,ci)=>{ s+=`<text x=\"${lW+ci*(cW+gap)+cW/2}\" y=\"${lH-7}\" text-anchor=\"middle\" font-size=\"11\" fill=\"${B.fg2}\">${h}<\u002Ftext>`; });\n  days.forEach((d,ri)=>{\n    const y=lH+ri*(cH+gap);\n    s+=`<text x=\"${lW-8}\" y=\"${y+cH/2+4}\" text-anchor=\"end\" font-size=\"11\" fill=\"${B.fg2}\">${d}<\u002Ftext>`;\n    hrs.forEach((h,ci)=>{\n      const x=lW+ci*(cW+gap), val=raw[ri][ci], fill=pal[val];\n      const tf=val>=2?'#fff':B.fg2;\n      s+=`<rect x=\"${x}\" y=\"${y}\" width=\"${cW}\" height=\"${cH}\" rx=\"3\" fill=\"${fill}\"/>`;\n      s+=`<text x=\"${x+cW/2}\" y=\"${y+cH/2+4}\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" fill=\"${tf}\">${val*4+Math.floor(Math.random()*4)}<\u002Ftext>`;\n    });\n  });\n  s+=`<\u002Fsvg>`;\n  el.innerHTML=s;\n})();\n\n/* ════ 8. FUNNEL ════ */\nfunction renderFunnel(id,steps){\n  const el=document.getElementById(id);\n  const W=Math.max(el.offsetWidth||300,260),maxV=steps[0].value;\n  const colors=[B.b500,B.b400,B.b300,B.b200,B.b50];\n  const H=steps.length*56+8;\n  let s=`<svg viewBox=\"0 0 ${W} ${H}\" width=\"100%\" style=\"font-family:'Source Sans Pro',sans-serif\">`;\n  steps.forEach((st,i)=>{\n    const pct=st.value/maxV, bW=Math.max(pct*(W-80),80);\n    const x=(W-bW)/2, y=i*56+4;\n    const drop=i>0?Math.round((1-st.value/steps[i-1].value)*100):null;\n    s+=`<rect x=\"${x}\" y=\"${y}\" width=\"${bW}\" height=\"38\" rx=\"3\" fill=\"${colors[i]}\"/>`;\n    s+=`<text x=\"${W/2}\" y=\"${y+23}\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" fill=\"#fff\">${st.label}<\u002Ftext>`;\n    s+=`<text x=\"${x+bW+8}\" y=\"${y+23}\" font-size=\"11\" fill=\"${B.fg2}\">${st.value.toLocaleString()}<\u002Ftext>`;\n    if(drop!==null) s+=`<text x=\"${W-2}\" y=\"${y+23}\" text-anchor=\"end\" font-size=\"10\" fill=\"${B.err}\">−${drop}%<\u002Ftext>`;\n  });\n  s+=`<\u002Fsvg>`;\n  el.innerHTML=s;\n}\nrenderFunnel('funnel1',[{label:'Requisitions',value:8500},{label:'Approved',value:5200},{label:'PO Issued',value:3800},{label:'Received',value:3100},{label:'Invoiced',value:2840}]);\nrenderFunnel('funnel2',[{label:'Submitted',value:1200},{label:'Under Review',value:880},{label:'Approved',value:650},{label:'Fulfilled',value:590}]);\n\n/* ════ 9. WAFFLE ════ */\nfunction renderWaffle(id,segments){\n  const el=document.getElementById(id);\n  const cells=[];\n  segments.forEach(s=>{ for(let i=0;i<s.v;i++) cells.push(s.c); });\n  cells.forEach(c=>{\n    const d=document.createElement('div');\n    d.style.cssText=`width:calc(10% - 3px);aspect-ratio:1;background:${c};border-radius:2px;flex-shrink:0`;\n    el.appendChild(d);\n  });\n}\nrenderWaffle('waffle1',[{v:68,c:B.b500},{v:14,c:B.b300},{v:12,c:B.b50},{v:6,c:B.b100}]);\n\n/* ════ 10. TREEMAP ════ */\n(function(){\n  const el=document.getElementById('treemap1');\n  const W=el.offsetWidth||800,H=340;\n  const data=[\n    {name:'Sales / Enterprise',value:180,d:0},{name:'Engineering / Frontend',value:120,d:1},\n    {name:'Sales / SMB',value:110,d:0},{name:'Engineering / Backend',value:95,d:1},\n    {name:'Marketing / Content',value:80,d:2},{name:'Product / Design',value:70,d:3},\n    {name:'Engineering / DevOps',value:60,d:1},{name:'Marketing / Paid',value:65,d:2},\n    {name:'Product / Research',value:50,d:3},{name:'Support',value:40,d:4}\n  ].sort((a,b)=>b.value-a.value);\n  const total=data.reduce((a,d)=>a+d.value,0);\n  const cols=[B.b500,B.b400,B.b300,B.b200,B.b50];\n  const half=Math.ceil(data.length/2);\n  const top=data.slice(0,half),bot=data.slice(half);\n  const topTotal=top.reduce((a,d)=>a+d.value,0);\n  const topH=Math.round(H*topTotal/total);\n  let s=`<svg viewBox=\"0 0 ${W} ${H}\" width=\"100%\" style=\"font-family:'Source Sans Pro',sans-serif\">`;\n  function row(items,y,h){\n    const rt=items.reduce((a,d)=>a+d.value,0);\n    let cx=0;\n    items.forEach((d,i)=>{\n      const cw=(d.value/rt)*W;\n      const col=cols[d.d]||B.b500;\n      const tf='#fff';\n      s+=`<rect x=\"${cx+1}\" y=\"${y+1}\" width=\"${cw-2}\" height=\"${h-2}\" rx=\"3\" fill=\"${col}\"/>`;\n      if(cw>30&&h>20){\n        const parts=d.name.split('/');\n        const label=parts.length>1?parts[0].trim():d.name;\n        const sub=parts.length>1?parts[1].trim():'';\n        s+=`<text x=\"${cx+cw/2}\" y=\"${y+h/2+(sub&&h>36?-7:4)}\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\" fill=\"${tf}\">${cw>70?label:label.slice(0,6)+'…'}<\u002Ftext>`;\n        if(sub&&h>36) s+=`<text x=\"${cx+cw/2}\" y=\"${y+h/2+8}\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">${cw>60?sub:sub.slice(0,5)+'…'}<\u002Ftext>`;\n        if(h>52) s+=`<text x=\"${cx+cw/2}\" y=\"${y+h-10}\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">$${d.value}k<\u002Ftext>`;\n      }\n      cx+=cw;\n    });\n  }\n  row(top,0,topH);\n  row(bot,topH,H-topH);\n  s+=`<\u002Fsvg>`;\n  el.innerHTML=s;\n})();\n\n/* ════ 11. BUMP ════ */\n(function(){\n  const el=document.getElementById('bump1');\n  const quarters=['Q1\\'24','Q2\\'24','Q3\\'24','Q4\\'24','Q1\\'25'];\n  const series=[\n    {name:'Supplier A',ranks:[1,2,1,3,2],c:B.b500},\n    {name:'Supplier B',ranks:[3,1,2,1,1],c:B.b400},\n    {name:'Supplier C',ranks:[2,3,3,2,3],c:B.b300},\n    {name:'Supplier D',ranks:[4,4,4,4,4],c:B.b200},\n    {name:'Supplier E',ranks:[5,5,5,5,5],c:B.b50},\n  ];\n  const W=Math.max(el.offsetWidth||640,400),H=220;\n  const pL=90,pR=90,pT=28,pB=8;\n  const gW=W-pL-pR,gH=H-pT-pB;\n  const xS=gW/(quarters.length-1),yS=gH/4;\n  let s=`<svg viewBox=\"0 0 ${W} ${H}\" width=\"100%\" style=\"font-family:'Source Sans Pro',sans-serif\">`;\n  quarters.forEach((q,i)=>{ s+=`<text x=\"${pL+i*xS}\" y=\"${pT-8}\" text-anchor=\"middle\" font-size=\"10\" fill=\"${B.fg2}\">${q}<\u002Ftext>`; });\n  series.forEach(sr=>{\n    const pts=sr.ranks.map((r,i)=>[pL+i*xS,pT+(r-1)*yS]);\n    let d=`M${pts[0][0]},${pts[0][1]}`;\n    for(let i=1;i<pts.length;i++){ const mx=(pts[i][0]+pts[i-1][0])/2; d+=` C${mx},${pts[i-1][1]} ${mx},${pts[i][1]} ${pts[i][0]},${pts[i][1]}`; }\n    s+=`<path d=\"${d}\" fill=\"none\" stroke=\"${sr.c}\" stroke-width=\"2.5\"/>`;\n    pts.forEach(([x,y])=>{ s+=`<circle cx=\"${x}\" cy=\"${y}\" r=\"4\" fill=\"${B.white}\" stroke=\"${sr.c}\" stroke-width=\"2\"/>`; });\n    s+=`<text x=\"${pL-8}\" y=\"${pts[0][1]+4}\" text-anchor=\"end\" font-size=\"11\" fill=\"${sr.c}\" font-weight=\"600\">${sr.name}<\u002Ftext>`;\n    s+=`<text x=\"${pL+gW+8}\" y=\"${pts[pts.length-1][1]+4}\" font-size=\"11\" fill=\"${sr.c}\" font-weight=\"600\">#${sr.ranks[sr.ranks.length-1]}<\u002Ftext>`;\n  });\n  s+=`<\u002Fsvg>`;\n  el.innerHTML=s;\n})();\n\n/* ════ 12. STREAM ════ */\n(function(){\n  const labels=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n  const keys=['Imaging','Surgical','ICU','Lab','Cardio'];\n  const cols=[B.b500,B.b400,B.b300,B.b200,B.b50];\n  const raw=keys.map(()=>labels.map(()=>Math.floor(Math.random()*180+40)));\n  new Chart('stream1',{type:'line',data:{labels,datasets:keys.map((k,i)=>({label:k,data:raw[i],borderColor:cols[i],backgroundColor:cols[i]+'55',borderWidth:1.5,fill:i===0?'origin':'-1',tension:.4,pointRadius:0}))},options:{responsive:true,maintainAspectRatio:false,...NL,scales:{x:XA,y:{...YA,stacked:false}},interaction:{mode:'index',intersect:false}}});\n})();\n\n/* ════ 13. DASHBOARD — VA Dashboard patterns ════ */\n\n// Response Time Trend — line with benchmark reference line\n(function(){\n  const labels = ['2023-01','2023-04','2023-07','2023-10','2024-01','2024-04','2024-07','2024-10','2025-01'];\n  const resolution = [88,72,62,68,80,85,78,82,74];\n  const benchmark  = [90,90,90,90,90,90,90,90,90];\n  new Chart('dash-trend',{type:'line',data:{labels,datasets:[\n    {label:'Resolution Rate (≤2 days)',data:resolution,borderColor:B.b500,borderWidth:2.5,tension:.35,fill:false,...pt(B.b500),pointRadius:3},\n    {label:'Benchmark (90%)',data:benchmark,borderColor:B.b200,borderWidth:1.5,borderDash:[6,4],tension:0,fill:false,pointRadius:0},\n  ]},options:{responsive:true,maintainAspectRatio:false,...NL,\n    scales:{\n      x:{...XA,ticks:{...XA.ticks,maxRotation:45,font:{size:10,family:\"'Source Sans Pro'\"}}},\n      y:{...YA,min:0,max:100,ticks:{...YA.ticks,callback:v=>v+'%'}}\n    }}});\n})();\n\n// Equipment Type donut\nnew Chart('dash-equip-donut',{type:'doughnut',\n  data:{labels:['CT','Analyzer','MRI','SPECT','PET/CT','X-Ray/Fluoro','Other'],\n    datasets:[{data:[13,11,9,7,5,5,17],backgroundColor:[B.b500,B.b400,B.b300,B.b200,B.b50,B.b100,B.n300||'#CCCCCC'],borderWidth:2,borderColor:'#fff',hoverOffset:5}]},\n  options:{responsive:true,maintainAspectRatio:false,cutout:'55%',...NL}});\n\n// Critical Events by Location — horizontal bar\nnew Chart('dash-location-bar',{type:'bar',\n  data:{labels:['Sinai Hospital of Baltimore','Carroll Hospital','Grace Medical Center','NW Hospital Center'],\n    datasets:[{data:[38,22,5,2],backgroundColor:[B.b500,B.b400,B.b300,B.b200],borderRadius:3}]},\n  options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',...NL,\n    scales:{\n      x:{...XA,ticks:{...XA.ticks,stepSize:10}},\n      y:{...YA,grid:{display:false},ticks:{...YA.ticks,font:{size:11,family:\"'Source Sans Pro'\"}}}\n    }}});\n\n// Critical Events by Manufacturer — horizontal bar\nnew Chart('dash-mfr-bar',{type:'bar',\n  data:{labels:['Philips','General Electric','Siemens','Sebia','DiaSorin','Stryker','Medrad','Parks Medical','Biosense Webster','Roche'],\n    datasets:[{data:[19,18,12,4,3,2,2,1,1,1],backgroundColor:B.b500,borderRadius:3,hoverBackgroundColor:B.b700}]},\n  options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',...NL,\n    scales:{\n      x:{...XA},\n      y:{...YA,grid:{display:false},ticks:{...YA.ticks,font:{size:10,family:\"'Source Sans Pro'\"}}}\n    }}});\n\n// Critical Events by Vendor Type — horizontal bar\nnew Chart('dash-vendor-bar',{type:'bar',\n  data:{labels:['OEM','ISO','Unknown'],\n    datasets:[{data:[46,18,3],backgroundColor:[B.b500,B.b400,B.b200],borderRadius:3}]},\n  options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',...NL,\n    scales:{\n      x:{...XA},\n      y:{...YA,grid:{display:false},ticks:{...YA.ticks,font:{size:11,family:\"'Source Sans Pro'\"}}}\n    }}});\n\n/* ─── Lucide icons ─── */\nif(typeof lucide!=='undefined') lucide.createIcons();\n\n}); // DOMContentLoaded\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
