  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n  <meta charset=\"utf-8\">\n  <title>PartsSource Brand Colors<\u002Ftitle>\n  \n  \n  <style>\n    /* Design Tokens */\n    :root {\n      --ps-brand-primary: #005BA6;\n      --ps-fg-primary: #2B2B2B;\n      --ps-fg-secondary: #4A4A4A;\n      --ps-border-default: #E6E6E6;\n      --ps-font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;\n      --ps-text-primary: #2B2B2B;\n      --ps-text-secondary: #777777;\n    }\n    \n    *{box-sizing:border-box;}\n    html,body{margin:0;padding:0;}\n    body{padding:32px 40px 72px;font-family:var(--ps-font-sans);background:#fff;color:var(--ps-fg-primary);font-size:15px;}\n\n    h1{font-size:28px;font-weight:600;margin:0 0 8px;letter-spacing:-.2px;}\n    .intro{font-size:15px;color:var(--ps-fg-secondary);margin:0 0 32px;max-width:860px;line-height:1.6;}\n\n    .section{margin-bottom:40px;border:1px solid var(--ps-border-default);border-radius:12px;overflow:hidden;background:#fff;}\n    .section-head{padding:18px 24px;border-bottom:1px solid var(--ps-border-default);background:#FAFAFA;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}\n    .section-head h2{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ps-brand-primary);font-weight:700;margin:0;flex-shrink:0;}\n    .section-head .desc{font-size:13px;color:var(--ps-fg-secondary);line-height:1.5;flex:1;}\n\n    .section-body{padding:24px;}\n\n    .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;}\n    .sw{border:1px solid #E6E6E6;border-radius:8px;overflow:hidden;background:#fff;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;}\n    .sw:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,47,72,.12);border-color:#D0D7DE;}\n    .sw:active{transform:translateY(0);}\n    .chip{height:150px;display:flex;align-items:flex-end;padding:14px 16px;position:relative;}\n    .chip.outlined{box-shadow:inset 0 0 0 1px #DCDCDC;}\n    .chip .badge{font-size:12px;letter-spacing:.5px;padding:4px 9px;border-radius:4px;background:rgba(0,0,0,.22);color:#fff;text-transform:uppercase;font-weight:600;backdrop-filter:blur(2px);font-family:ui-monospace,Menlo,monospace;}\n    .chip.light .badge{background:rgba(0,0,0,.08);color:#2B2B2B;}\n    .lbl{padding:16px 18px 18px;border-top:1px solid #F1F1F1;}\n    .name{font-weight:600;color:var(--ps-text-primary);font-size:16px;line-height:1.25;}\n    .hex{color:var(--ps-text-secondary);font-size:14px;letter-spacing:.5px;margin-top:6px;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;display:flex;align-items:center;gap:8px;}\n    .copyhint{margin-left:auto;font-size:11px;color:#B0B0B0;letter-spacing:.5px;opacity:0;transition:opacity .12s;font-family:var(--ps-font-sans);text-transform:none;}\n    .sw:hover .copyhint{opacity:1;}\n    .sw.copied{border-color:#17AB78;box-shadow:0 0 0 2px rgba(23,171,120,.25);}\n    .sw.copied .copyhint{opacity:1;color:#17AB78;}\n\n    hr{border:0;border-top:1px solid #EEE;margin:36px 0;}\n\n    /* Modal */\n    .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:24px;}\n    .modal.open{display:flex;}\n    .card{background:#fff;border-radius:10px;width:min(860px,100%);max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);}\n    .card-chip{height:320px;display:flex;align-items:flex-end;padding:24px 28px;position:relative;}\n    .card-chip .close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);border:0;color:inherit;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}\n    .card-chip .close:hover{background:rgba(255,255,255,.35);}\n    .card-chip.light .close{background:rgba(0,0,0,.08);color:#2B2B2B;}\n    .card-chip.light .close:hover{background:rgba(0,0,0,.15);}\n    .card-title{font-size:28px;font-weight:700;line-height:1.1;}\n    .card-body{padding:24px 28px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;background:#FAFAFA;}\n    .meta-block{}\n    .meta-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#949494;font-weight:600;margin-bottom:6px;}\n    .meta-val{font-family:ui-monospace,Menlo,monospace;font-size:16px;color:#2B2B2B;background:#fff;border:1px solid #E6E6E6;border-radius:6px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:border-color .12s;}\n    .meta-val:hover{border-color:#005BA6;}\n    .meta-val .c{font-size:10px;color:#949494;letter-spacing:.5px;text-transform:uppercase;}\n    .usage{padding:0 28px 28px;background:#FAFAFA;}\n    .usage-head{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#949494;font-weight:600;margin-bottom:10px;}\n    .usage-text{font-size:14px;color:#2B2B2B;line-height:1.6;}\n\n    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:#002F48;color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:200;}\n    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}\n  <\u002Fstyle>\n<\u002Fhead>\n<body>\n\n  <h1>Brand Colors<\u002Fh1>\n  <p class=\"intro\">The PartsSource palette, organized by hue family. Click any swatch to copy its hex, or double-click to see full color details and usage guidance.<\u002Fp>\n\n  <div id=\"sections\"><div class=\"section\"><div class=\"section-head\"><h2>Primary<\u002Fh2><div class=\"desc\">The signature PartsSource blue. Used for product names, footer, links, breadcrumbs, and focused/pressed input states.<\u002Fdiv><\u002Fdiv><div class=\"section-body\"><div class=\"row\">\n        <div class=\"sw\" data-hex=\"#005BA6\" data-name=\"PS Blue\" data-usage=\"Primary brand color. Links, breadcrumbs, focused input outlines, key section titles, and product names.\">\n          <div class=\"chip\" style=\"background:#005BA6;color:#fff;\">\n            <span class=\"badge\">#005BA6<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"lbl\">\n            <div class=\"name\">PS Blue<\u002Fdiv>\n            <div class=\"hex\">#005BA6<span class=\"copyhint\">Click to copy<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"section\"><div class=\"section-head\"><h2>Blues<\u002Fh2><div class=\"desc\">Darker shades for headings and hover states; Azure for informational highlights.<\u002Fdiv><\u002Fdiv><div class=\"section-body\"><div class=\"row\">\n        <div class=\"sw\" data-hex=\"#004A84\" data-name=\"Blue 2\" data-usage=\"Hover / pressed state for PS Blue. Use for button hover on blue fills.\">\n          <div class=\"chip\" style=\"background:#004A84;color:#fff;\">\n            <span class=\"badge\">#004A84<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"lbl\">\n            <div class=\"name\">Blue 2<\u002Fdiv>\n            <div class=\"hex\">#004A84<span class=\"copyhint\">Click to copy<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sw\" data-hex=\"#002F48\" data-name=\"Blue 3\" data-usage=\"Darkest blue. Reserved for display headings and deep navigation surfaces.\">\n          <div class=\"chip\" style=\"background:#002F48;color:#fff;\">\n            <span class=\"badge\">#002F48<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"lbl\">\n            <div class=\"name\">Blue 3<\u002Fdiv>\n            <div class=\"hex\">#002F48<span class=\"copyhint\">Click to copy<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sw\" data-hex=\"#009CF4\" data-name=\"Azure Blue\" data-usage=\"Informational highlights, link color on dark surfaces, info alert accents.\">\n          <div class=\"chip\" style=\"background:#009CF4;color:#fff;\">\n            <span class=\"badge\">#009CF4<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"lbl\">\n            <div class=\"name\">Azure Blue<\u002Fdiv>\n            <div class=\"hex\">#009CF4<span class=\"copyhint\">Click to copy<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sw\" data-hex=\"#B0C6D3\" data-name=\"Light Blue\" data-usage=\"Info alert background, subtle highlight tints, table row selection.\">\n          <div class=\"chip\" style=\"background:#B0C6D3;color:#fff;\">\n            <span class=\"badge\">#B0C6D3<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"lbl\">\n            <div class=\"name\">Light Blue<\u002Fdiv>\n            <div class=\"hex\">#B0C6D3<span class=\"copyhint\">Click to copy<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"section\"><div class=\"section-head\"><h2>Oranges<\u002Fh2><div class=\"desc\">Primary CTA ramp. Orange 1 is the default button fill; 2 &amp; 3 are hover/pressed; 4 &amp; 5 are light tints for backgrounds and highlights.<\u002Fdiv><\u002Fdiv><div class=\"section-body\"><div class=\"row\">\n        <div class=\"sw\" data-hex=\"#FF9505\" data-name=\"Orange 1\" data-usage=\"Default CTA fill. Primary buttons, &quot;Add to cart&quot;, key action chips.\">\n          <div class=\"chip\" style=\"background:#FF9505;color:#fff;\">\n            <span class=\"badge\">#FF9505<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"lbl\">\n            <div class=\"name\">Orange 1<\u002Fdiv>\n            <div class=\"hex\">#FF9505<span class=\"copyhint\">Click to copy<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sw\" data-hex=\"#EC8000\" data-name=\"Orange 2\" data-usage=\"Hover state for primary orange buttons.\">\n          <div class=\"chip\" style=\"background:#EC8000;color:#fff;\">\ " formulary score pill.' },\n        { name:'Very Good', hex:'#03C700', usage:'\"Very Good\" formulary score pill.' },\n        { name:'Moderate',  hex:'#E9E022', usage:'\"Moderate\" formulary score pill.' },\n        { name:'Fair',      hex:'#F58B00', usage:'\"Fair\" formulary score pill.' },\n        { name:'Poor',      hex:'#DE3700', usage:'\"Poor\" formulary score pill.' },\n      ]\n    },\n    {\n      name: 'Plus+ Rewards',\n      sub: 'PartsSource Plus+ program accents. Used only inside Plus+ branded surfaces.',\n      colors: [\n        { name:'Plus Teal', hex:'#03D0BF', usage:'Plus+ accent fill, reward badges, program CTA highlights.' },\n        { name:'Plus Blue', hex:'#005BB7', usage:'Plus+ primary brand blue (slightly brighter than PS Blue).' },\n      ]\n    },\n  ];\n\n  // --- Helpers ---\n  const hexToRgb = h => {\n    const n = parseInt(h.slice(1), 16);\n    return [(n>>16)&255, (n>>8)&255, n&255];\n  };\n  const rgbToHsl = (r,g,b) => {\n    r/=255; g/=255; b/=255;\n    const max=Math.max(r,g,b), min=Math.min(r,g,b);\n    let h=0, s=0, l=(max+min)/2;\n    if (max!==min) {\n      const d=max-min;\n      s = l>0.5 ? d/(2-max-min) : d/(max+min);\n      switch(max){\n        case r: h=(g-b)/d+(g<b?6:0); break;\n        case g: h=(b-r)/d+2; break;\n        case b: h=(r-g)/d+4; break;\n      }\n      h*=60;\n    }\n    return [Math.round(h), Math.round(s*100), Math.round(l*100)];\n  };\n  const luminance = hex => {\n    const [r,g,b] = hexToRgb(hex).map(c => {\n      c /= 255;\n      return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);\n    });\n    return 0.2126*r + 0.7152*g + 0.0722*b;\n  };\n  const isLight = hex => luminance(hex) > 0.55;\n\n  // --- Render grid ---\n  const sectionsEl = document.getElementById('sections');\n  let html = '';\n  for (const g of groups){\n    html += `<div class=\"section\"><div class=\"section-head\"><h2>${g.name}<\u002Fh2><div class=\"desc\">${g.sub}<\u002Fdiv><\u002Fdiv><div class=\"section-body\"><div class=\"row\">`;\n    for (const c of g.colors){\n      const light = isLight(c.hex);\n      const outlined = c.hex.toUpperCase() === '#FFFFFF';\n      html += `\n        <div class=\"sw\" data-hex=\"${c.hex}\" data-name=\"${c.name}\" data-usage=\"${c.usage.replace(/\"/g,'&quot;')}\">\n          <div class=\"chip${light?' light':''}${outlined?' outlined':''}\" style=\"background:${c.hex};color:${light?'#2B2B2B':'#fff'};\">\n            <span class=\"badge\">${c.hex}<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"lbl\">\n            <div class=\"name\">${c.name}<\u002Fdiv>\n            <div class=\"hex\">${c.hex}<span class=\"copyhint\">Click to copy<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>`;\n    }\n    html += `<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  }\n  sectionsEl.innerHTML = html;\n\n  // --- Interactions ---\n  const toast = document.getElementById('toast');\n  function showToast(msg){\n    toast.textContent = msg;\n    toast.classList.add('show');\n    clearTimeout(toast._t);\n    toast._t = setTimeout(()=>toast.classList.remove('show'), 1200);\n  }\n\n  // Single click → copy hex. Double click → open detail modal.\n  sectionsEl.addEventListener('click', e => {\n    const sw = e.target.closest('.sw');\n    if (!sw) return;\n    const hex = sw.dataset.hex;\n    navigator.clipboard?.writeText(hex);\n    sw.classList.add('copied');\n    setTimeout(()=>sw.classList.remove('copied'), 600);\n    showToast(`Copied ${hex}`);\n  });\n  sectionsEl.addEventListener('dblclick', e => {\n    const sw = e.target.closest('.sw');\n    if (!sw) return;\n    openModal(sw.dataset.hex, sw.dataset.name, sw.dataset.usage);\n  });\n\n  // --- Modal ---\n  const modal = document.getElementById('modal');\n  const card = document.getElementById('card');\n  function openModal(hex, name, usage){\n    const [r,g,b] = hexToRgb(hex);\n    const [h,s,l] = rgbToHsl(r,g,b);\n    const light = isLight(hex);\n    const outlined = hex.toUpperCase() === '#FFFFFF';\n    card.innerHTML = `\n      <div class=\"card-chip${light?' light':''}${outlined?' outlined':''}\" style=\"background:${hex};color:${light?'#2B2B2B':'#fff'};box-shadow:${outlined?'inset 0 0 0 1px #DCDCDC':'none'}\">\n        <button class=\"close\" aria-label=\"Close\">✕<\u002Fbutton>\n        <div>\n          <div style=\"font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.75;margin-bottom:8px;\">Brand Color<\u002Fdiv>\n          <div class=\"card-title\">${name}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card-body\">\n        <div class=\"meta-block\">\n          <div class=\"meta-label\">Hex<\u002Fdiv>\n          <div class=\"meta-val\" data-copy=\"${hex}\">${hex}<span class=\"c\">copy<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"meta-block\">\n          <div class=\"meta-label\">RGB<\u002Fdiv>\n          <div class=\"meta-val\" data-copy=\"rgb(${r}, ${g}, ${b})\">rgb(${r}, ${g}, ${b})<span class=\"c\">copy<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"meta-block\">\n          <div class=\"meta-label\">HSL<\u002Fdiv>\n          <div class=\"meta-val\" data-copy=\"hsl(${h}, ${s}%, ${l}%)\">hsl(${h}, ${s}%, ${l}%)<span class=\"c\">copy<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"usage\">\n        <div class=\"usage-head\">Usage<\u002Fdiv>\n        <div class=\"usage-text\">${usage}<\u002Fdiv>\n      <\u002Fdiv>\n    `;\n    modal.classList.add('open');\n    card.querySelector('.close').onclick = closeModal;\n    card.querySelectorAll('.meta-val').forEach(el=>{\n      el.onclick = () => {\n        navigator.clipboard?.writeText(el.dataset.copy);\n        showToast(`Copied ${el.dataset.copy}`);\n      };\n    });\n  }\n  function closeModal(){ modal.classList.remove('open'); }\n  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });\n  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });\n<\u002Fscript>\n\n<!-- Accessibility -->\n<div style=\"margin:40px;padding:24px;border:1px solid #DCDCDC;border-radius:12px;background:#fff;\">\n  <h2 style=\"font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#005BA6;font-weight:700;margin:0 0 4px;\">Accessibility &amp; Best Practices<\u002Fh2>\n  <p style=\"font-size:13px;color:#5C5C5C;margin:0 0 16px;\">WCAG compliance and implementation guidance for inclusive color usage.<\u002Fp>\n  <ul style=\"margin:0;padding-left:20px;line-height:1.8;font-size:13px;color:#4A4A4A;\">\n    <li><strong>Never use color alone to convey meaning<\u002Fstrong> — always pair with text, icons, or patterns (WCAG 1.4.1)<\u002Fli>\n    <li><strong>Contrast ratios:<\u002Fstrong> Text on colored backgrounds must meet 4.5:1 (small text) or 3:1 (large 18px+/14px+ bold)<\u002Fli>\n    <li><strong>UI component contrast:<\u002Fstrong> Interactive elements (buttons, inputs) need 3:1 contrast against adjacent colors (WCAG 1.4.11)<\u002Fli>\n    <li><strong>Orange CTAs are deprecated<\u002Fstrong> — not ADA compliant; use blue outline buttons for primary actions<\u002Fli>\n    <li><strong>Test with color blindness simulators<\u002Fstrong> — red/green confusion is most common (8% of men)<\u002Fli>\n    <li><strong>Status colors:<\u002Fstrong> Success (green), error (red), warning (orange), info (blue) must be paired with icons and labels<\u002Fli>\n    <li><strong>Link color:<\u002Fstrong> PS Blue (#005BA6) meets WCAG AA on white; underline on hover provides additional affordance<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
