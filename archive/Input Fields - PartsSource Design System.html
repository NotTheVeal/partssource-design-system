  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n  <meta charset=\"utf-8\">\n  <title>Input Fields — PartsSource Design System<\u002Ftitle>\n  \n  <!-- Bundler thumbnail -->\n  \n  \n  <style>\n  /* Inline colors_and_type.css */\n  @font-face {\n    font-family: 'Source Sans Pro';\n    src: url(\"afdcf74e-9be5-4560-8295-e20544c542f7\") format('truetype');\n    font-weight: 300;\n    font-style: normal;\n    font-display: swap;\n  }\n  @font-face {\n    font-family: 'Source Sans Pro';\n    src: url(\"7e7ce580-73b9-491d-a691-73e4ed7e2ea7\") format('truetype');\n    font-weight: 400;\n    font-style: normal;\n    font-display: swap;\n  }\n  @font-face {\n    font-family: 'Source Sans Pro';\n    src: url(\"ea62ca6e-1b83-4dc9-bf12-c55fb8299978\") format('truetype');\n    font-weight: 600;\n    font-style: normal;\n    font-display: swap;\n  }\n  @font-face {\n    font-family: 'Source Sans Pro';\n    src: url(\"6e0df98c-ac60-45c2-a9f9-9c03651b1a7f\") format('truetype');\n    font-weight: 700;\n    font-style: normal;\n    font-display: swap;\n  }\n\n  :root {\n    --ps-brand-primary: #005BA6;\n    --ps-orange-1: #FF9505;\n    --ps-gray-0: #FFFFFF;\n    --ps-gray-4: #949494;\n    --ps-gray-5: #4A4A4A;\n    --ps-gray-6: #2B2B2B;\n    --ps-fg-primary: #2B2B2B;\n    --ps-fg-secondary: #4A4A4A;\n    --ps-fg-tertiary: #949494;\n    --ps-bg-default: #FFFFFF;\n    --ps-border-default: #E6E6E6;\n    --ps-font-sans: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;\n  }\n\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{padding:32px 40px 56px;font-family:var(--ps-font-sans);background:#fff;color:var(--ps-fg-primary);}\n\n    h1{font-size:28px;font-weight:600;margin:0 0 8px;letter-spacing:-.2px;}\n    .intro{font-size:15px;color:var(--ps-fg-secondary);margin:0 0 32px;max-width:860px;line-height:1.6;}\n\n    .section{border:1px solid var(--ps-border-default);border-radius:12px;overflow:hidden;background:#fff;margin-bottom:32px;}\n    .section-head{padding:18px 24px;border-bottom:1px solid var(--ps-border-default);background:#FAFAFA;}\n    .section-head h2{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ps-brand-primary);font-weight:700;margin:0 0 4px;}\n    .section-head .desc{font-size:13px;color:var(--ps-fg-secondary);line-height:1.5;}\n\n    .inputs{padding:24px;display:flex;flex-direction:column;gap:24px;}\n\n    /* Input wrapper */\n    .input-wrap {\n      position: relative;\n      width: 335px;\n      height: 48px;\n    }\n    .input-wrap input,\n    .input-wrap select {\n      width: 100%;\n      height: 48px;\n      padding: 0 10px;\n      font-family: 'Source Sans Pro', sans-serif;\n      font-size: 16px;\n      line-height: 100%;\n      color: #000000;\n      background: white;\n      border: 1px solid #949494;\n      border-radius: 3px;\n      box-sizing: border-box;\n      outline: none;\n      transition: all 0.2s;\n    }\n    .input-wrap input::placeholder {\n      color: transparent;\n    }\n    .input-wrap label {\n      position: absolute;\n      left: 10px;\n      top: 0;\n      height: 48px;\n      display: flex;\n      align-items: center;\n      font-family: 'Source Sans Pro', sans-serif;\n      font-size: 16px;\n      line-height: 100%;\n      color: #4A4A4A;\n      pointer-events: none;\n      transition: all 0.2s;\n    }\n\n    /* Floating label when focused or has value */\n    .input-wrap input:focus + label,\n    .input-wrap select:focus + label,\n    .input-wrap.has-value label,\n    .input-wrap label.has-value {\n      top: 5px;\n      height: 22px;\n      align-items: flex-start;\n      font-size: 12px;\n      font-weight: 700;\n      color: #005BA6;\n    }\n\n    /* Adjust padding when label floats */\n    .input-wrap input:focus,\n    .input-wrap.has-value input,\n    .input-wrap select:focus,\n    .input-wrap.has-value select {\n      padding-top: 22px;\n      padding-bottom: 4px;\n    }\n\n    /* Focus state - blue border with shadow */\n    .input-wrap input:focus,\n    .input-wrap select:focus {\n      border-color: #005DA6;\n      box-shadow: 0px 0px 10px 0px rgba(0, 91, 166, 0.5);\n    }\n\n    /* Hover - black border */\n    .input-wrap input:hover:not(:focus):not(:disabled),\n    .input-wrap select:hover:not(:focus):not(:disabled) {\n      border-color: #000000;\n    }\n\n    /* Disabled - light grey */\n    .input-wrap input:disabled,\n    .input-wrap select:disabled {\n      border-color: #DCDCDC;\n      color: #DCDCDC;\n      background: white;\n      cursor: not-allowed;\n    }\n    .input-wrap input:disabled + label,\n    .input-wrap select:disabled + label {\n      color: #DCDCDC;\n    }\n\n    /* Large inputs (80px) */\n    .input-wrap.large {\n      height: 80px;\n    }\n    .input-wrap.large input {\n      height: 80px;\n    }\n    .input-wrap.large label {\n      height: 80px;\n    }\n    \n    /* Large input floating label */\n    .input-wrap.large input:focus + label,\n    .input-wrap.large.has-value label,\n    .input-wrap.large label.has-value {\n      top: 8px;\n      height: 32px;\n      font-size: 12px;\n    }\n    \n    /* Large input with floating label - adjust padding */\n    .input-wrap.large input:focus,\n    .input-wrap.large.has-value input {\n      padding-top: 32px;\n      padding-bottom: 8px;\n    }\n\n    /* Dropdown arrow icon - add to all dropdown inputs */\n    .input-wrap input[id^=\"dropdown\"] {\n      background-image: url(\"data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M6 9L12 15L18 9' stroke='%23949494' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E\");\n      background-repeat: no-repeat;\n      background-position: right 10px center;\n      background-size: 24px 24px;\n      padding-right: 40px;\n      cursor: pointer;\n    }\n    .input-wrap input[id^=\"dropdown\"]:disabled {\n      cursor: not-allowed;\n    }\n\n    /* Error state */\n    .input-wrap.error input {\n      border-color: #D32F2F;\n      color: #D32F2F;\n    }\n    .input-wrap.error input:focus {\n      border-color: #D32F2F;\n      box-shadow: 0px 0px 10px 0px rgba(211, 47, 47, 0.5);\n    }\n    .input-wrap.error label {\n      color: #D32F2F;\n    }\n    .error-message {\n      font-size: 11px;\n      color: #D32F2F;\n      margin-top: 4px;\n    }\n    \n    /* Custom dropdown container - must be position relative */\n    .inputs > div {\n      position: relative;\n    }\n    \n    /* Dropdown menu - Type 1 (standard 10-item) */\n    .dropdown-menu {\n      position: absolute;\n      top: calc(100% + 1px);\n      left: 0;\n      width: 335px;\n      max-height: 297px;\n      overflow-y: auto;\n      background: white;\n      border: 1px solid #F1F1F1;\n      border-radius: 2px;\n      box-shadow: 0 4px 4px rgba(0,0,0,0.25);\n      display: none;\n      z-index: 1000;\n    }\n    .show-menu .dropdown-menu {\n      display: block;\n    }\n    .dropdown-item {\n      padding: 14px 10px;\n      font-size: 14px;\n      font-family: 'Source Sans Pro', sans-serif;\n      color: #000000;\n      border-bottom: 1px solid #F1F1F1;\n      cursor: pointer;\n      transition: background 0.15s;\n    }\n    .dropdown-item:last-child {\n      border-bottom: none;\n    }\n    .dropdown-item:hover {\n      background: #D0EDFC;\n    }\n    .dropdown-item.selected {\n      background: #D0EDFC;\n    }\n\n    /* Dropdown menu - Type 2 (3-option with bold text) */\n    .dropdown-menu-type2 {\n      position: absolute;\n      top: calc(100% + 1px);\n      left: 0;\n      width: 335px;\n      background: white;\n      border: 1px solid #F1F1F1;\n      border-radius: 2px;\n      box-shadow: 0 4px 4px rgba(0,0,0,0.25);\n      display: none;\n      z-index: 1000;\n    }\n    .show-menu .dropdown-menu-type2 {\n      display: block;\n    }\n    .dropdown-menu-type2 .dropdown-item {\n      padding: 14px 10px;\n      font-size: 14px;\n      font-family: 'Source Sans Pro', sans-serif;\n      font-weight: 700;\n      color: #000000;\n      border-bottom: 1px solid #F1F1F1;\n      cursor: pointer;\n      transition: background 0.15s;\n    }\n    .dropdown-menu-type2 .dropdown-item:last-child {\n      border-bottom: none;\n    }\n    .dropdown-menu-type2 .dropdown-item:first-child {\n      background: #F1F1F1;\n    }\n    .dropdown-menu-type2 .dropdown-item:hover {\n      background: #D6EBFF;\n    }\n    /* Static hover state - non-interactive demo */\n    .static-hover .dropdown-item:first-child {\n      background: #D6EBFF !important;\n      pointer-events: none;\n    }\n    .static-hover .dropdown-item {\n      pointer-events: none;\n    }\n    /* State labels */\n    .state-label {\n      font-size: 11px;\n      color: #949494;\n      letter-spacing: 0.5px;\n      text-transform: uppercase;\n      margin-bottom: 8px;\n      font-weight: 600;\n    }\n  <\u002Fstyle>\n<\u002Fhead>\n<body data-cc-id=\"cc-1\" style=\"cursor: crosshair; font-family: &quot;Source Sans Pro&quot;;\">\n\n  <h1>Input Fields<\u002Fh1>\n  <p class=\"intro\">Text inputs and dropdowns are fundamental form controls used throughout the PartsSource platform. These components follow consistent styling, spacing, and interaction patterns to ensure a cohesive user experience across all applications.<\u002Fp>\n\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <h2>Text Field — 48px<\u002Fh2>\n      <div class=\"desc\">Standard text input with floating label. Pulled directly from Figma <code>Input Fields<\u002Fcode> frame.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"inputs\">\n      <div>\n        <div class=\"state-label\">Idle &amp; Empty (Interactive)<\u002Fdiv>\n        <div class=\"input-wrap\">\n          <input type=\"text\" id=\"input1\">\n          <label>Label<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"pointer-events: none;\">\n        <div class=\"state-label\">Hover<\u002Fdiv>\n        <div class=\"input-wrap\">\n          <input type=\"text\" id=\"input2\" style=\"border-color: #000000;\">\n          <label>Label<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"pointer-events: none;\">\n        <div class=\"state-label\">Focused<\u002Fdiv>\n        <div class=\"input-wrap\">\n          <input type=\"text\" id=\"input3\" style=\"border: 1px solid #005DA6; box-shadow: 0px 0px 10px 0px rgba(0, 91, 166, 0.5);\">\n          <label style=\"top: 5px; height: 22px; align-items: flex-start; font-size: 12px; font-weight: 700; color: #005BA6;\">Label<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"pointer-events: none;\">\n        <div class=\"state-label\">With Value<\u002Fdiv>\n        <div class=\"input-wrap has-value\">\n          <input type=\"text\" id=\"input4\" value=\"Input Text\" readonly=\"\" style=\"padding-top: 22px; padding-bottom: 4px;\">\n          <label class=\"has-value\">Label<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"pointer-events: none;\">\n        <div class=\"state-label\">Disabled<\u002Fdiv>\n        <div class=\"input-wrap\">\n          <input type=\"text\" id=\"input5\" disabled=\"\">\n          <label>Label<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 80px Large Inputs -->\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <h2>Large Input Fields — 80px<\u002Fh2>\n      <div class=\"desc\">Larger text inputs for prominent form fields.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"inputs\">\n      <div>\n        <div class=\"state-label\">Idle &amp; Empty (Interactive)<\u002Fdiv>\n        <div class=\"input-wrap large\">\n          <input type=\"text\" id=\"input-lg1\">\n          <label>Label<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"pointer-events: none;\">\n        <div class=\"state-label\">Hover<\u002Fdiv>\n        <div class=\"input-wrap large\">\n          <input type=\"text\" id=\"input-lg2\" style=\"border-color: #000000;\">\n          <label>Label<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"pointer-events: none;\">\n        <div class=\"state-label\">Focused<\u002Fdiv>\n        <div class=\"input-wrap large\">\n          <input type=\"text\" id=\"input-lg3\" style=\"border: 1px solid #005DA6; box-shadow: 0px 0px 10px 0px rgba(0, 91, 166, 0.5);\">\n          <label style=\"top: 8px; height: 32px; align-items: flex-start; font-size: 12px; font-weight: 700; color: #005BA6;\">Label<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"pointer-events: none;\">\n        <div class=\"state-label\">With Value<\u002Fdiv>\n        <div class=\"input-wrap large has-value\">\n          <input type=\"text\" id=\"input-lg4\" value=\"Text Input\" readonly=\"\" style=\"padding-top: 32px; padding-bottom: 8px;\">\n          <label class=\"has-value\">Label<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"pointer-events: none;\">\n        <div class=\"state-label\">Disabled<\u002Fdiv>\n        <div class=\"input-wrap large\">\n          <input type=\"text\" id=\"input-lg5\" disabled=\"\">\n          <label>Label<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Error State -->\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <h2>Text Field — 48px — Error<\u002Fh2>\n      <div class=\"desc\">Error<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"inputs\">\n      <div style=\"pointer-events: none;\">\n        <div class=\"state-label\">Error State<\u002Fdiv>\n        <div class=\"input-wrap has-value error\">\n          <input type=\"text\" id=\"input-error\" value=\"invalid@\" readonly=\"\" style=\"padding-top: 22px; padding-bottom: 4px;\">\n          <label class=\"has-value\">Email<\u002Flabel>\n        <\u002Fdiv>\n        <div class=\"error-message\">Please enter a valid email address<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Dropdown Type 1 -->\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <h2>Dropdown · Type 1: Standard with 3-item menu<\u002Fh2>\n      <div class=\"desc\">Standard dropdown with type-ahead search.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"inputs\" style=\"gap: 48px; min-height: 300px;\">\n      <!-- Idle & Empty (Interactive) -->\n      <div id=\"dropdown-type1-interactive\">\n        <div class=\"state-label\">Idle &amp; Empty (Interactive)<\u002Fdiv>\n        <div class=\"input-wrap\">\n          <input type=\"text\" id=\"dropdown1-interactive\" autocomplete=\"off\">\n          <label>Label<\u002Flabel>\n        <\u002Fdiv>\n        <div class=\"dropdown-menu\" style=\"display: none;\">\n          <div class=\"dropdown-item\">Item 1<\u002Fdiv>\n          <div class=\"dropdown-item\">Item 2<\u002Fdiv>\n          <div class=\"dropdown-item\">Item 3<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      \n      <!-- Open with menu -->\n      <div class=\"show-menu\" style=\"pointer-events: none;\">\n        <div class=\"state-label\">Open with Menu<\u002Fdiv>\n        <div class=\"input-wrap has-value\">\n          <input type=\"text\" id=\"dropdown1\" value=\"Label\" autocomplete=\"off\" readonly=\"\">\n          <label class=\"has-value\">Label<\u002Flabel>\n        <\u002Fdiv>\n        <div class=\"dropdown-menu\">\n          <div class=\"dropdown-item\">Item 1<\u002Fdiv>\n          <div class=\"dropdown-item selected\">Item 2<\u002Fdiv>\n          <div class=\"dropdown-item\">Item 3<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Item Selected -->\n      <div style=\"pointer-events: none;\">\n        <div class=\"state-label\">Item Selected<\u002Fdiv>\n        <div class=\"input-wrap has-value\">\n          <input type=\"text\" id=\"dropdown2\" value=\"Item 2\" readonly=\"\" style=\"padding-top: 22px; padding-bottom: 4px;\">\n          <label class=\"has-value\">Label<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Disabled -->\n      <div style=\"pointer-events: none;\">\n        <div class=\"state-label\">Disabled<\u002Fdiv>\n        <div class=\"input-wrap\">\n          <input type=\"text\" id=\"dropdown3\" disabled=\"\">\n          <label>Label<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Dropdown Type 2 -->\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <h2>Dropdown · Type 2: Input Dropdown with 3-option menu<\u002Fh2>\n      <div class=\"desc\">Compact dropdown with type-ahead filtering for shorter option lists.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"inputs\" style=\"gap: 48px; min-height: 250px;\">\n      <!-- Idle & Empty (Interactive) -->\n      <div id=\"dropdown-type2-interactive\">\n        <div class=\"state-label\">Idle &amp; Empty (Interactive)<\u002Fdiv>\n        <div class=\"input-wrap\">\n          <input type=\"text\" id=\"dropdown4-interactive\" autocomplete=\"off\">\n          <label>Label<\u002Flabel>\n        <\u002Fdiv>\n        <div class=\"dropdown-menu-type2\" style=\"display: none;\">\n          <div class=\"dropdown-item\">Option 1<\u002Fdiv>\n          <div class=\"dropdown-item\">Option 2<\u002Fdiv>\n          <div class=\"dropdown-item\">Option 3<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      \n      <!-- Open with typing -->\n      <div class=\"show-menu\" style=\"pointer-events: none;\">\n        <div class=\"state-label\">Open with Typing<\u002Fdiv>\n        <div class=\"input-wrap has-value\">\n          <input type=\"text\" id=\"dropdown4\" value=\"Opt\" autocomplete=\"off\" readonly=\"\">\n          <label class=\"has-value\">Label<\u002Flabel>\n        <\u002Fdiv>\n        <div class=\"dropdown-menu-type2\">\n          <div class=\"dropdown-item\">Option 1<\u002Fdiv>\n          <div class=\"dropdown-item\">Option 2<\u002Fdiv>\n          <div class=\"dropdown-item\">Option 3<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      \n      <!-- Item hovering -->\n      <div class=\"show-menu\" style=\"pointer-events: none;\">\n        <div class=\"state-label\">Item Hovering<\u002Fdiv>\n        <div class=\"input-wrap has-value\">\n          <input type=\"text\" id=\"dropdown5\" value=\"Label\" readonly=\"\">\n          <label class=\"has-value\">Label<\u002Flabel>\n        <\u002Fdiv>\n        <div class=\"dropdown-menu-type2\">\n          <div class=\"dropdown-item\" style=\"background: #D6EBFF;\">Option 1<\u002Fdiv>\n          <div class=\"dropdown-item\">Option 2<\u002Fdiv>\n          <div class=\"dropdown-item\">Option 3<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      \n      <!-- Item Selected -->\n      <div style=\"pointer-events: none;\">\n        <div class=\"state-label\">Item Selected<\u002Fdiv>\n        <div class=\"input-wrap has-value\">\n          <input type=\"text\" id=\"dropdown-selected\" value=\"Option 2\" readonly=\"\" style=\"padding-top: 22px; padding-bottom: 4px;\">\n          <label class=\"has-value\">Label<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      \n      <!-- Disabled -->\n      <div style=\"pointer-events: none;\">\n        <div class=\"state-label\">Disabled<\u002Fdiv>\n        <div class=\"input-wrap\">\n          <input type=\"text\" id=\"dropdown6\" disabled=\"\">\n          <label>Label<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <script>\n    // Toggle has-value class based on input content\n    function updateLabel(input) {\n      const wrap = input.closest('.input-wrap');\n      if (input.value.trim()) {\n        wrap.classList.add('has-value');\n      } else {\n        wrap.classList.remove('has-value');\n      }\n    }\n\n    // Attach to all inputs\n    document.querySelectorAll('.input-wrap input').forEach(el => {\n      el.addEventListener('input', () => updateLabel(el));\n      el.addEventListener('change', () => updateLabel(el));\n      // Init on load\n      updateLabel(el);\n    });\n    \n    // Dropdown functionality\n    document.querySelectorAll('.dropdown-menu .dropdown-item, .dropdown-menu-type2 .dropdown-item').forEach(item => {\n      item.addEventListener('click', function() {\n        const menu = this.closest('.dropdown-menu, .dropdown-menu-type2');\n        const container = menu.closest('div');\n        const input = container.querySelector('input');\n        \n        // Update input value\n        input.value = this.textContent;\n        updateLabel(input);\n        \n        // Hide menu\n        container.classList.remove('show-menu');\n        \n        // Update selected state\n        menu.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('selected'));\n        this.classList.add('selected');\n      });\n    });\n    \n    // Show/hide dropdowns on focus/blur and click - ONLY for interactive ones\n    const interactiveDropdowns = ['dropdown1-interactive', 'dropdown4-interactive'];\n    \n    interactiveDropdowns.forEach(id => {\n      const input = document.getElementById(id);\n      if (!input) return;\n      \n      input.addEventListener('click', function() {\n        const container = this.closest('div').parentElement;\n        const menu = container.querySelector('.dropdown-menu, .dropdown-menu-type2');\n        if (menu) {\n          // Toggle menu display\n          if (menu.style.display === 'block') {\n            menu.style.display = 'none';\n          } else {\n            // Close all other interactive menus first\n            interactiveDropdowns.forEach(otherId => {\n              const otherInput = document.getElementById(otherId);\n              if (otherInput && otherInput !== this) {\n                const otherContainer = otherInput.closest('div').parentElement;\n                const otherMenu = otherContainer.querySelector('.dropdown-menu, .dropdown-menu-type2');\n                if (otherMenu) otherMenu.style.display = 'none';\n              }\n            });\n            menu.style.display = 'block';\n          }\n        }\n      });\n      \n      input.addEventListener('blur', function(e) {\n        // Delay to allow click on dropdown item\n        setTimeout(() => {\n          const container = this.closest('div').parentElement;\n          const menu = container.querySelector('.dropdown-menu, .dropdown-menu-type2');\n          if (menu && !menu.querySelector('.dropdown-item:hover')) {\n            menu.style.display = 'none';\n          }\n        }, 200);\n      });\n    });\n    \n    // Handle clicks on interactive dropdown items\n    document.querySelectorAll('#dropdown-type1-interactive .dropdown-item, #dropdown-type2-interactive .dropdown-item').forEach(item => {\n      item.addEventListener('click', function() {\n        const container = this.closest('#dropdown-type1-interactive, #dropdown-type2-interactive');\n        const input = container.querySelector('input');\n        const menu = this.closest('.dropdown-menu, .dropdown-menu-type2');\n        \n        // Update input value\n        input.value = this.textContent;\n        updateLabel(input);\n        \n        // Hide menu\n        menu.style.display = 'none';\n        \n        // Update selected state\n        menu.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('selected'));\n        this.classList.add('selected');\n      });\n    });\n  <\u002Fscript>\n\n  <!-- Accessibility -->\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <h2>Accessibility &amp; Best Practices<\u002Fh2>\n      <div class=\"desc\">WCAG compliance, keyboard support, and implementation guidance for inclusive form design.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"states\">\n      <ul style=\"margin:0;padding:20px 24px;line-height:1.8;font-size:13px;color:#4A4A4A;list-style-position:outside;\">\n        <li><strong>Minimum 48px height<\u002Fstrong> for all inputs to meet touch target guidelines (WCAG 2.5.5)<\u002Fli>\n        <li><strong>Floating labels:<\u002Fstrong> Label must remain visible when input has value — floats to top at 12px, never disappears<\u002Fli>\n        <li><strong>Focus indicators:<\u002Fstrong> Blue border (10px blur shadow) provides clear keyboard focus state that meets WCAG AA contrast<\u002Fli>\n        <li><strong>Error states:<\u002Fstrong> Red border + error message below input — use <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#F1F1F1;padding:2px 5px;border-radius:3px;color:#2B2B2B;\">aria-describedby<\u002Fcode> to associate error text with input<\u002Fli>\n        <li><strong>Required fields:<\u002Fstrong> Mark with asterisk (*) in label AND use <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#F1F1F1;padding:2px 5px;border-radius:3px;color:#2B2B2B;\">aria-required=\"true\"<\u002Fcode><\u002Fli>\n        <li><strong>Disabled inputs:<\u002Fstrong> Use <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#F1F1F1;padding:2px 5px;border-radius:3px;color:#2B2B2B;\">disabled<\u002Fcode> attribute (not just visual styling) so screen readers announce the state<\u002Fli>\n        <li><strong>Dropdown keyboard navigation:<\u002Fstrong> Arrow keys navigate items, Enter selects, Escape closes menu<\u002Fli>\n        <li><strong>Placeholder text:<\u002Fstrong> Use sparingly — should supplement label, not replace it (low contrast makes it inaccessible)<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n\n<chatgpt-sidebar data-rendered=\"true\" data-gpts-theme=\"light\"><\u002Fchatgpt-sidebar><\u002Fbody><\u002Fhtml>"
