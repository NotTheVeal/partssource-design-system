  <title>Alerts — PartsSource Design System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #ffffff; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n  <meta charset=\"utf-8\">\n  <title>Alerts — PartsSource Design System<\u002Ftitle>\n  \n  <!-- Bundler thumbnail (splash screen) -->\n  \n  \n  <!-- Font dependencies -->\n  \n  \n  \n  \n  <style>\n    /* Inline font faces using window.__resources */\n    @font-face {\n      font-family: \"Metronic Pro\";\n      src: url(\"\") format(\"opentype\");\n      font-weight: 400; font-style: normal; font-display: swap;\n    }\n    @font-face {\n      font-family: \"Metronic Pro\";\n      src: url(\"\") format(\"opentype\");\n      font-weight: 600; font-style: normal; font-display: swap;\n    }\n    @font-face {\n      font-family: \"Metronic Pro\";\n      src: url(\"\") format(\"opentype\");\n      font-weight: 700; font-style: normal; font-display: swap;\n    }\n    \n    /* CSS variables */\n    :root {\n      --ps-blue-500: #005BA6;\n      --ps-blue-900: #002F48;\n      --ps-neutral-0: #FFFFFF;\n      --ps-neutral-50: #FAFAFA;\n      --ps-neutral-200: #DCDCDC;\n      --ps-neutral-500: #777777;\n      --ps-neutral-700: #4A4A4A;\n      --ps-brand-primary: var(--ps-blue-500);\n      --ps-fg-primary: var(--ps-neutral-700);\n      --ps-fg-secondary: var(--ps-neutral-500);\n      --ps-border-default: var(--ps-neutral-200);\n      --ps-font-sans: \"Source Sans Pro\", -apple-system, BlinkMacSystemFont, sans-serif;\n    }\n  <\u002Fstyle>\n  \n  <script>\n    // Load fonts from bundled resources\n    if (window.__resources) {\n      const style = document.createElement('style');\n      style.textContent = `\n        @font-face {\n          font-family: \"Metronic Pro\";\n          src: url(${window.__resources.metronicReg}) format(\"opentype\");\n          font-weight: 400; font-style: normal;\n        }\n        @font-face {\n          font-family: \"Metronic Pro\";\n          src: url(${window.__resources.metronicSemiBold}) format(\"opentype\");\n          font-weight: 600; font-style: normal;\n        }\n        @font-face {\n          font-family: \"Metronic Pro\";\n          src: url(${window.__resources.metronicBold}) format(\"opentype\");\n          font-weight: 700; font-style: normal;\n        }\n      `;\n      document.head.appendChild(style);\n    }\n  <\u002Fscript>\n  <style>\n    *{box-sizing:border-box;}\n    html,body{margin:0;padding:0;}\n    body{padding:32px 40px 56px;font-family:var(--ps-font-sans);background:#fff;color:var(--ps-fg-primary);}\n\n    h1{font-size:28px;font-weight:600;margin:0 0 8px;letter-spacing:-.2px;}\n    .intro{font-size:15px;color:var(--ps-fg-secondary);margin:0 0 32px;max-width:860px;line-height:1.6;}\n\n    .section{border:1px solid var(--ps-border-default);border-radius:12px;overflow:hidden;background:#fff;margin-bottom:32px;}\n    .section-head{padding:18px 24px;border-bottom:1px solid var(--ps-border-default);background:#FAFAFA;}\n    .section-head h2{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ps-brand-primary);font-weight:700;margin:0 0 4px;}\n    .section-head .desc{font-size:13px;color:var(--ps-fg-secondary);line-height:1.5;}\n\n    .alerts{padding:24px;display:flex;flex-direction:column;gap:16px;}\n\n    /* Alert base — 40px min-height, 5px radius, icon + text */\n    .alert{\n      display:flex;align-items:center;gap:18px;\n      min-height:40px;padding:12px 18px 12px 18px;border-radius:5px;\n      font-size:14px;line-height:18px;position:relative;\n    }\n    .alert svg{\n      flex-shrink:0;width:24px;height:24px;\n      stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;\n    }\n    .alert .txt{font-weight:700;flex:1;}\n\n    /* Close button */\n    .alert .close{\n      flex-shrink:0;width:24px;height:24px;\n      background:transparent;border:0;cursor:pointer;\n      display:flex;align-items:center;justify-content:center;\n      opacity:.6;transition:opacity .15s;padding:0;margin-left:12px;\n    }\n    .alert .close:hover{opacity:1;}\n    .alert .close svg{width:18px;height:18px;stroke-width:2.5;}\n\n    /* Action buttons — Secondary SM from button spec */\n    .alert .actions{\n      display:flex;gap:8px;margin-left:auto;padding-left:18px;\n    }\n    .alert .actions button{\n      height:32px;min-width:87px;padding:0 8px;\n      border-radius:4px;border:1px solid #DCDCDC;\n      font-family: 'Source Sans Pro',var(--ps-font-sans);font-size:10px;font-weight:500;\n      background:#fff;color:#4A4A4A;cursor:pointer;\n      transition:background .15s,color .15s,border-color .15s;\n    }\n    .alert .actions button:hover{\n      background:#005BA6;color:#fff;border-color:#005BA6;\n    }\n\n    /* Success — green */\n    .alert.success{background:#E2F5EE;color:#0E7C55;}\n    .alert.success svg{stroke:#0E7C55;}\n    .alert.success .close svg{stroke:#0E7C55;}\n\n    /* Fail — red */\n    .alert.fail{background:#FEF0F0;color:#E00000;}\n    .alert.fail svg{stroke:#E00000;}\n    .alert.fail .close svg{stroke:#E00000;}\n\n    /* Info — blue */\n    .alert.info{background:#EFF9FE;color:#005BA6;}\n    .alert.info svg{stroke:#005BA6;}\n    .alert.info .close svg{stroke:#005BA6;}\n\n    /* Warning — amber */\n    .alert.warning{background:#FFF4E5;color:#B45309;}\n    .alert.warning svg{stroke:#B45309;}\n    .alert.warning .close svg{stroke:#B45309;}\n\n    /* Toast notifications — transient bottom-right popups */\n    .toast-container{\n      position:fixed;bottom:24px;right:24px;\n      display:flex;flex-direction:column;gap:12px;\n      max-width:420px;z-index:9999;pointer-events:none;\n    }\n    .toast{\n      display:flex;align-items:center;gap:18px;\n      min-height:56px;padding:16px 18px;border-radius:8px;\n      font-size:14px;line-height:18px;\n      box-shadow:0 4px 12px rgba(0,0,0,.15),0 0 0 1px rgba(0,0,0,.05);\n      pointer-events:auto;\n      animation:slideIn .25s ease-out;\n    }\n    @keyframes slideIn{\n      from{transform:translateX(100%);opacity:0;}\n      to{transform:translateX(0);opacity:1;}\n    }\n    .toast svg{\n      flex-shrink:0;width:24px;height:24px;\n      stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;\n    }\n    .toast .txt{font-weight:600;flex:1;}\n    .toast .close{\n      flex-shrink:0;width:24px;height:24px;\n      background:transparent;border:0;cursor:pointer;\n      display:flex;align-items:center;justify-content:center;\n      opacity:.6;transition:opacity .15s;padding:0;margin-left:12px;\n    }\n    .toast .close:hover{opacity:1;}\n    .toast .close svg{width:18px;height:18px;stroke-width:2.5;}\n\n    /* Toast variants */\n    .toast.success{background:#E2F5EE;color:#0E7C55;}\n    .toast.success svg{stroke:#0E7C55;}\n    .toast.success .close svg{stroke:#0E7C55;}\n\n    .toast.fail{background:#FEF0F0;color:#E00000;}\n    .toast.fail svg{stroke:#E00000;}\n    .toast.fail .close svg{stroke:#E00000;}\n\n    .toast.info{background:#EFF9FE;color:#005BA6;}\n    .toast.info svg{stroke:#005BA6;}\n    .toast.info .close svg{stroke:#005BA6;}\n\n    .caption{font-size:13px;color:var(--ps-fg-secondary);line-height:1.5;margin-top:8px;}\n    .caption code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#F1F1F1;padding:2px 6px;border-radius:3px;color:#2B2B2B;}\n  <\u002Fstyle>\n<\u002Fhead>\n<body>\n  <h1>Alerts<\u002Fh1>\n  <p class=\"intro\">Inline notification banners that communicate status, feedback, and important information to users. Three core variants (Success, Info, Fail) come directly from Figma; Warning and dismissible/actionable patterns follow design system best practices.<\u002Fp>\n\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <h2>Core Alert Variants<\u002Fh2>\n      <div class=\"desc\">Pulled directly from the Figma <code>Success Alert<\u002Fcode>, <code>Fail Alert<\u002Fcode>, and <code>Info Alert<\u002Fcode> frames. Warning variant follows brand palette.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"alerts\">\n\n      <!-- Success -->\n      <div>\n        <div class=\"alert success\">\n          <!-- lucide: circle-check-big -->\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n            <path d=\"M21.801 10A10 10 0 1 1 17 3.335\"><\u002Fpath>\n            <path d=\"m9 11 3 3L22 4\"><\u002Fpath>\n          <\u002Fsvg>\n          <span class=\"txt\">Requester Has been Nudged for Part Order #: 64434335<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"caption\">\n          Background <code>#E2F5EE<\u002Fcode> (Form Success tint), text + icon Green 3 <code>#0E7C55<\u002Fcode>. 18 px gap between icon and label.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Fail -->\n      <div>\n        <div class=\"alert fail\">\n          <!-- lucide: circle-x -->\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n            <circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle>\n            <path d=\"m15 9-6 6\"><\u002Fpath>\n            <path d=\"m9 9 6 6\"><\u002Fpath>\n          <\u002Fsvg>\n          <span class=\"txt\">Part Order #: 64434335 has been Rejected.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"caption\">\n          Background <code>#FEF0F0<\u002Fcode>, text + icon <code>#E00000<\u002Fcode> (Red 1). Per Figma redlines.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Info -->\n      <div>\n        <div class=\"alert info\">\n          <!-- lucide: info -->\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n            <circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle>\n            <path d=\"M12 16v-4\"><\u002Fpath>\n            <path d=\"M12 8h.01\"><\u002Fpath>\n          <\u002Fsvg>\n          <span class=\"txt\">You have a new PM for Asset 343433.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"caption\">\n          Background <code>#EFF9FE<\u002Fcode>, text + icon PS Blue <code>#005BA6<\u002Fcode>. Use for neutral notifications and updates.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Warning -->\n      <div>\n        <div class=\"alert warning\">\n          <!-- lucide: alert-triangle -->\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n            <path d=\"m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"><\u002Fpath>\n            <path d=\"M12 9v4\"><\u002Fpath>\n            <path d=\"M12 17h.01\"><\u002Fpath>\n          <\u002Fsvg>\n          <span class=\"txt\">Your session will expire in 5 minutes. Save your work.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"caption\">\n          Background <code>#FFF4E5<\u002Fcode>, text + icon <code>#B45309<\u002Fcode> (amber). Use for non-critical but important warnings.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Dismissible Alerts -->\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <h2>Dismissible Alerts<\u002Fh2>\n      <div class=\"desc\">Add a close button (18×18 × icon, 24 px hit area) on the right. Use for low-priority info that users can safely dismiss.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"alerts\">\n\n      <div>\n        <div class=\"alert info\">\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n            <circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle>\n            <path d=\"M12 16v-4\"><\u002Fpath>\n            <path d=\"M12 8h.01\"><\u002Fpath>\n          <\u002Fsvg>\n          <span class=\"txt\">New features are now available. Check out the latest updates.<\u002Fspan>\n          <button class=\"close\" aria-label=\"Dismiss\">\n            <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n              <path d=\"M18 6 6 18\"><\u002Fpath>\n              <path d=\"m6 6 12 12\"><\u002Fpath>\n            <\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"caption\">\n          Info alert with dismiss. Close icon opacity 60%, 100% on hover.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div class=\"alert success\">\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n            <path d=\"M21.801 10A10 10 0 1 1 17 3.335\"><\u002Fpath>\n            <path d=\"m9 11 3 3L22 4\"><\u002Fpath>\n          <\u002Fsvg>\n          <span class=\"txt\">Your preferences have been saved successfully.<\u002Fspan>\n          <button class=\"close\" aria-label=\"Dismiss\">\n            <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n              <path d=\"M18 6 6 18\"><\u002Fpath>\n              <path d=\"m6 6 12 12\"><\u002Fpath>\n            <\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"caption\">\n          Success confirmation with dismiss. Use after non-critical user actions.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Alerts with Actions -->\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <h2>Alerts with Actions<\u002Fh2>\n      <div class=\"desc\">Include 1–2 action buttons (Secondary SM style: 32 px, 10px Source Sans Pro Medium, 4 px radius, neutral grey border). All buttons use the same neutral Secondary style regardless of alert variant.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"alerts\">\n\n      <div>\n        <div class=\"alert fail\">\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n            <circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle>\n            <path d=\"m15 9-6 6\"><\u002Fpath>\n            <path d=\"m9 9 6 6\"><\u002Fpath>\n          <\u002Fsvg>\n          <span class=\"txt\">Payment failed. Please update your billing information.<\u002Fspan>\n          <div class=\"actions\">\n            <button>Update<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"caption\">\n          Error alert with single action. Button uses neutral Secondary SM style (grey border, PS Blue hover).\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div class=\"alert warning\">\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n            <path d=\"m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"><\u002Fpath>\n            <path d=\"M12 9v4\"><\u002Fpath>\n            <path d=\"M12 17h.01\"><\u002Fpath>\n          <\u002Fsvg>\n          <span class=\"txt\">This action cannot be undone. Are you sure you want to continue?<\u002Fspan>\n          <div class=\"actions\">\n            <button>Cancel<\u002Fbutton>\n            <button>Continue<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"caption\">\n          Warning with two actions. Use sparingly — limit to 2 buttons max per alert.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div class=\"alert info\">\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n            <circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle>\n            <path d=\"M12 16v-4\"><\u002Fpath>\n            <path d=\"M12 8h.01\"><\u002Fpath>\n          <\u002Fsvg>\n          <span class=\"txt\">A software update is available. Restart now or schedule for later.<\u002Fspan>\n          <div class=\"actions\">\n            <button>Later<\u002Fbutton>\n            <button>Restart<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"caption\">\n          Info with choice actions. Primary action (Restart) on the right.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Multi-line -->\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <h2>Multi-line Support<\u002Fh2>\n      <div class=\"desc\">Alerts auto-grow to fit content (min-height 40 px). Best practice: limit to 2 lines (~140 chars) to avoid obscuring main content.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"alerts\">\n\n      <div>\n        <div class=\"alert warning\">\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n            <path d=\"m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"><\u002Fpath>\n            <path d=\"M12 9v4\"><\u002Fpath>\n            <path d=\"M12 17h.01\"><\u002Fpath>\n          <\u002Fsvg>\n          <span class=\"txt\">Scheduled maintenance will occur on Saturday, May 3rd from 2:00 AM to 6:00 AM EST. Some features may be temporarily unavailable during this time.<\u002Fspan>\n          <button class=\"close\" aria-label=\"Dismiss\">\n            <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n              <path d=\"M18 6 6 18\"><\u002Fpath>\n              <path d=\"m6 6 12 12\"><\u002Fpath>\n            <\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"caption\">\n          Two-line alert with dismiss. Text wraps naturally; icon and close button stay top-aligned.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Toast Notifications -->\n  <div class=\"section\">\n    <div class=\"section-head\">\n      <h2>Toast Notifications<\u002Fh2>\n      <div class=\"desc\">Transient popups that appear bottom-right, auto-dismiss after 3–5 seconds. Use for non-blocking feedback: \"Item added\", \"Changes saved\", \"Upload complete\". 56 px min-height, 8 px radius, elevated shadow.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"alerts\">\n\n      <div>\n        <div style=\"position:relative;height:80px;background:#FAFAFA;border-radius:8px;overflow:visible;\">\n          <div style=\"position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:12px;max-width:420px;\">\n            <div class=\"toast success\">\n              <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n                <path d=\"M21.801 10A10 10 0 1 1 17 3.335\"><\u002Fpath>\n                <path d=\"m9 11 3 3L22 4\"><\u002Fpath>\n              <\u002Fsvg>\n              <span class=\"txt\">Item added to cart<\u002Fspan>\n              <button class=\"close\" aria-label=\"Dismiss\">\n                <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n                  <path d=\"M18 6 6 18\"><\u002Fpath>\n                  <path d=\"m6 6 12 12\"><\u002Fpath>\n                <\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"caption\">\n          Success toast. In production, appears fixed bottom-right (24 px margin), slides in from right, max-width 420 px. Shadow: <code>0 4px 12px rgba(0,0,0,.15)<\u002Fcode>.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"position:relative;height:80px;background:#FAFAFA;border-radius:8px;overflow:visible;\">\n          <div style=\"position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:12px;max-width:420px;\">\n            <div class=\"toast info\">\n              <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n                <circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle>\n                <path d=\"M12 16v-4\"><\u002Fpath>\n                <path d=\"M12 8h.01\"><\u002Fpath>\n              <\u002Fsvg>\n              <span class=\"txt\">Your changes have been saved<\u002Fspan>\n              <button class=\"close\" aria-label=\"Dismiss\">\n                <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n                  <path d=\"M18 6 6 18\"><\u002Fpath>\n                  <path d=\"m6 6 12 12\"><\u002Fpath>\n                <\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"caption\">\n          Info toast. Use for confirmations and status updates. Auto-dismiss after 4–5 seconds or allow manual close.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"position:relative;height:80px;background:#FAFAFA;border-radius:8px;overflow:visible;\">\n          <div style=\"position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:12px;max-width:420px;\">\n            <div class=\"toast fail\">\n              <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n                <circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle>\n                <path d=\"m15 9-6 6\"><\u002Fpath>\n                <path d=\"m9 9 6 6\"><\u002Fpath>\n              <\u002Fsvg>\n              <span class=\"txt\">Upload failed. Please try again.<\u002Fspan>\n              <button class=\"close\" aria-label=\"Dismiss\">\n                <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n                  <path d=\"M18 6 6 18\"><\u002Fpath>\n                  <path d=\"m6 6 12 12\"><\u002Fpath>\n                <\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"caption\">\n          Error toast. Use sparingly — for non-critical errors that don't block workflow. Critical errors should use inline alerts or modals instead.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
