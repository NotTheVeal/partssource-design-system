<!-- @dsCard group="Components" name="Table" subtitle="Sortable data table with row selection, hover states, and empty state" viewport="700x280" -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../tokens.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head><body style="margin:0;padding:20px;background:#FAFAFA;">
<div id="root"></div>
<script>
(function(){
  var Table = window.Table;
  if (!Table) { document.getElementById('root').innerHTML='<p style="color:#9E2020;font-size:13px;font-family:sans-serif">⚠ Table not in bundle</p>'; return; }
  var e = React.createElement;
  var data = [
    {id:'PS000011',name:'Reusable Finger Sensor',vendor:'Masimo',status:'In Stock',price:'$42.00'},
    {id:'PS000012',name:'ECG Leadwire Set 10-Lead',vendor:'Nellcor',status:'In Stock',price:'$18.50'},
    {id:'PS000013',name:'Warming Unit Hose',vendor:'3M Arizant',status:'Low Stock',price:'$64.00'},
    {id:'PS000014',name:'Pulse Oximeter Probe',vendor:'Nellcor',status:'In Stock',price:'$31.00'},
  ];
  var cols = [
    {key:'id',header:'Item #',sortable:true},
    {key:'name',header:'Description',sortable:true},
    {key:'vendor',header:'Vendor'},
    {key:'status',header:'Status'},
    {key:'price',header:'Price',align:'right'},
  ];
  var Demo = function() {
    return e(Table,{columns:cols,data:data,onSelectionChange:function(){}});
  };
  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo,null));
})();
</script></body></html>
