<!-- @dsCard group="Components" name="Skeleton" subtitle="Shimmer loading placeholders — text, title, block, circle, button, input shapes + spinner" viewport="560x220" -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../tokens.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head><body style="margin:0;padding:24px;background:#FAFAFA;">
<div id="root"></div>
<script>
(function(){
  var Skeleton = window.Skeleton, Spinner = window.Spinner, SkeletonKeyframes = window.SkeletonKeyframes;
  if (!Skeleton) { document.getElementById('root').innerHTML='<p style="color:#9E2020;font-size:13px;font-family:sans-serif;padding:8px">⚠ Skeleton not in bundle — rebuild _ds_bundle.js</p>'; return; }
  var e = React.createElement;
  var lbl = function(t) { return e('p',{style:{margin:'0 0 8px',fontSize:11,fontWeight:700,letterSpacing:'1.2px',textTransform:'uppercase',color:'#999',fontFamily:'sans-serif'}},t); };

  var Demo = function() {
    return e('div',null,
      SkeletonKeyframes ? e(SkeletonKeyframes,null) : null,
      e('div',{style:{display:'flex',gap:32}},
        e('div',{style:{flex:1,display:'flex',flexDirection:'column',gap:12}},
          lbl('Shapes'),
          e('div',{style:{display:'flex',alignItems:'center',gap:12}},
            e(Skeleton,{shape:'circle',width:40,height:40}),
            e('div',{style:{flex:1,display:'flex',flexDirection:'column',gap:6}},
              e(Skeleton,{shape:'title'}),
              e(Skeleton,{shape:'text'})
            )
          ),
          e(Skeleton,{shape:'text'}),
          e(Skeleton,{shape:'text',width:'75%'}),
          e(Skeleton,{shape:'block',height:80}),
          e('div',{style:{display:'flex',gap:8}},
            e(Skeleton,{shape:'button'}),
            e(Skeleton,{shape:'input',width:160})
          )
        ),
        e('div',{style:{display:'flex',flexDirection:'column',gap:12,minWidth:100}},
          lbl('Spinner'),
          e('div',{style:{display:'flex',alignItems:'center',gap:16}},
            e(Spinner,{size:16}),
            e(Spinner,{size:24}),
            e(Spinner,{size:40})
          )
        )
      )
    );
  };
  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo,null));
})();
</script></body></html>
