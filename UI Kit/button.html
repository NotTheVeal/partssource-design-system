<!-- @dsCard group="Components" name="Button" subtitle="primary · secondary · tertiary · pill · inline — lg + sm sizes, all states" viewport="560x260" -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../tokens.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head><body style="margin:0;padding:20px;background:#FAFAFA;">
<div id="root"></div>
<script>
(function(){
  var Button = window.Button;
  if (!Button) { document.getElementById('root').innerHTML='<p style="color:#9E2020;font-size:13px;font-family:sans-serif">⚠ Button not in bundle</p>'; return; }
  var e = React.createElement;
  var row = function(children) { return e('div',{style:{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap',marginBottom:12}},children); };
  var Demo = function() {
    return e('div',{style:{padding:4}},
      row([
        e(Button,{key:'p',variant:'primary',size:'lg'},'Add to Cart'),
        e(Button,{key:'s',variant:'secondary',size:'lg'},'View Details'),
        e(Button,{key:'t',variant:'tertiary',size:'lg'},'Learn More'),
      ]),
      row([
        e(Button,{key:'pp',variant:'primary',size:'sm'},'Confirm'),
        e(Button,{key:'sp',variant:'secondary',size:'sm'},'Cancel'),
        e(Button,{key:'pi',variant:'pill'},'Upgrade to PRO'),
      ]),
      row([
        e(Button,{key:'d',variant:'primary',size:'lg',disabled:true},'Unavailable'),
        e(Button,{key:'l',variant:'primary',size:'lg',loading:true},'Processing'),
      ])
    );
  };
  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo,null));
})();
</script></body></html>
