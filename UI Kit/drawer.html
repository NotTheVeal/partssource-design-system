<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../tokens.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head><body style="margin:0;padding:20px;background:#FAFAFA;">
<div id="root"></div>
<script>
(function(){
  var Drawer = window.Drawer, Button = window.Button;
  if (!Drawer) { document.getElementById('root').innerHTML='<p style="color:#9E2020;font-size:13px;font-family:sans-serif">⚠ Drawer not in bundle</p>'; return; }
  var e = React.createElement;
  var Demo = function() {
    var s = React.useState(false), open = s[0], setOpen = s[1];
    return e('div',null,
      e('button',{
        onClick:function(){setOpen(true)},
        style:{height:40,padding:'0 20px',background:'var(--ps-prim-blue-500)',color:'white',border:'none',borderRadius:4,cursor:'pointer',fontFamily:'Source Sans Pro,sans-serif',fontSize:14,fontWeight:600}
      },'Open Drawer'),
      e(Drawer,{
        open:open,
        onClose:function(){setOpen(false)},
        title:'Part Details',
        subtitle:'Reusable Finger Sensor by Masimo',
        footer:e('div',{style:{display:'flex',gap:8}},
          e('button',{onClick:function(){setOpen(false)},style:{height:36,padding:'0 16px',border:'1px solid #ddd',borderRadius:4,background:'white',cursor:'pointer',fontFamily:'sans-serif'}},'Cancel'),
          e('button',{style:{height:36,padding:'0 16px',background:'var(--ps-prim-blue-500)',color:'white',border:'none',borderRadius:4,cursor:'pointer',fontFamily:'sans-serif'}},'Add to Cart')
        )
      },
        e('p',{style:{margin:0,fontSize:14,color:'#4A4A4A',fontFamily:'Source Sans Pro,sans-serif',lineHeight:1.6}},'PS000011 · OEM replacement sensor compatible with Masimo LNOP systems. Reusable construction rated for 200+ uses.')
      )
    );
  };
  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo,null));
})();
</script></body></html>
