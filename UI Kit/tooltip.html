<!-- @dsCard group="Components" name="Tooltip" subtitle="Hover/focus soft-dark bubble — 4 placements + rich info variant with title, body, and CTA" viewport="600x220" -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style id="ps-mobile-fix">
/* Mobile safety net: no horizontal page scroll on phones. */
@media (max-width: 640px){
  html, body { max-width: 100% !important; overflow-x: hidden !important; }
  body { padding-left: 16px !important; padding-right: 16px !important; }
  * { max-width: 100% !important; box-sizing: border-box !important; }
  img, svg, canvas, video, iframe { height: auto; }
  pre, code { white-space: pre-wrap !important; word-break: break-word !important; overflow-wrap: anywhere !important; }
  pre { overflow-x: auto !important; }
  table { display: block !important; width: 100% !important; overflow-x: auto !important; }
  [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
  [style*="display:flex"], [style*="display: flex"] { flex-wrap: wrap !important; }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../tokens.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head><body style="margin:0;padding:32px 24px;background:#FAFAFA;">
<div id="root"></div>
<script>
(function(){
  var Tooltip = window.Tooltip, TooltipRich = window.TooltipRich;
  if (!Tooltip) { document.getElementById('root').innerHTML='<p style="color:#9E2020;font-size:13px;font-family:sans-serif;padding:8px">⚠ Tooltip not in bundle — rebuild _ds_bundle.js</p>'; return; }
  var e = React.createElement;
  var lbl = function(t) { return e('p',{style:{margin:'0 0 14px',fontSize:11,fontWeight:700,letterSpacing:'1.2px',textTransform:'uppercase',color:'#999',fontFamily:'sans-serif'}},t); };

  var chip = function(txt) {
    return e('span',{
      tabIndex:0,
      style:{display:'inline-flex',alignItems:'center',height:32,padding:'0 14px',
        background:'var(--ps-prim-blue-500)',color:'white',borderRadius:4,
        fontSize:13,fontFamily:'Source Sans Pro,sans-serif',cursor:'default',fontWeight:600}
    },txt);
  };

  var Demo = function() {
    return e('div',{style:{display:'flex',flexDirection:'column',gap:28}},
      e('div',null,
        lbl('Placements — hover or focus each button'),
        e('div',{style:{display:'flex',gap:32,alignItems:'center',flexWrap:'wrap'}},
          e(Tooltip,{label:'Top tooltip',placement:'top'},chip('Top')),
          e(Tooltip,{label:'Bottom tooltip',placement:'bottom'},chip('Bottom')),
          e(Tooltip,{label:'Left tooltip',placement:'left'},chip('Left')),
          e(Tooltip,{label:'Right tooltip',placement:'right'},chip('Right'))
        )
      ),
      e('div',null,
        lbl('Rich tooltip'),
        e(TooltipRich,{
          title:'Sourcing recommendation',
          body:'This part has 3 alternative suppliers with shorter lead times based on your order history.',
          cta:{label:'View alternatives'}
        })
      )
    );
  };
  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo,null));
})();
</script></body></html>
