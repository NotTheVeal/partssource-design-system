<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../tokens.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head><body style="margin:0;padding:24px;background:#FAFAFA;">
<div id="root"></div>
<script>
(function(){
  var Breadcrumb = window.Breadcrumb, BreadcrumbBack = window.BreadcrumbBack;
  if (!Breadcrumb) { document.getElementById('root').innerHTML='<p style="color:#9E2020;font-size:13px;font-family:sans-serif;padding:8px">⚠ Breadcrumb not in bundle — rebuild _ds_bundle.js</p>'; return; }
  var e = React.createElement;
  var lbl = function(t) { return e('p',{style:{margin:'0 0 7px',fontSize:11,fontWeight:700,letterSpacing:'1.2px',textTransform:'uppercase',color:'#999',fontFamily:'sans-serif'}},t); };
  var Demo = function() {
    return e('div',{style:{display:'flex',flexDirection:'column',gap:22}},
      e('div',null,
        lbl('Trail'),
        e(Breadcrumb,{items:[
          {label:'Home',href:'#'},
          {label:'Parts Center',href:'#'},
          {label:'Air Filters',href:'#'},
          {label:'HEPA 12" Round'}
        ]})
      ),
      e('div',null,
        lbl('Back Arrow'),
        e(BreadcrumbBack,{label:'Back to Parts Center',href:'#'})
      )
    );
  };
  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo,null));
})();
</script></body></html>
